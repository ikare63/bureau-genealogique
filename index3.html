function archiveForStep(step){
  const repositories=data.repositories||[];
  const rawPlace=(step?.place||'').trim();
  const normalizedPlace=rawPlace
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[’']/g,"'")
    .toLowerCase();

  const stepText=`${step?.sourceCategory||''} ${step?.archiveName||''} ${step?.type||''} ${step?.title||''}`.toLowerCase();

  // La source explicitement demandée par l'étape est toujours prioritaire.
  // Une étape Geneanet doit donc ouvrir Geneanet, même si la commune possède
  // ses propres archives municipales.
  if(stepText.includes('geneanet')){
    return {url:'https://www.geneanet.org/',name:'Geneanet',level:'specified'};
  }
  if(step?.archiveUrl){
    return {
      url:step.archiveUrl,
      name:shortRepositoryName(step.archiveName||'Consulter la source'),
      level:'specified'
    };
  }

  // Les archives municipales ne sont proposées que pour une véritable étape
  // d'archives sans lien spécialisé déjà défini.
  const municipal=repositories.find(r=>{
    if(!r.url||!Array.isArray(r.communes)||!r.communes.length)return false;
    return r.communes.some(c=>
      String(c||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'')
        .replace(/[’']/g,"'").toLowerCase()===normalizedPlace
    )
  });
  if(municipal){
    return {url:municipal.url,name:shortRepositoryName(municipal.name),level:'municipal'};
  }

  let department=(step?.archiveDepartment||'').trim();
  if(!department){
    const placeDepartments={
      'Ronno':'Rhône','Amplepuis':'Rhône','Valsonne':'Rhône',
      'Saint-Appolinaire':'Rhône','Les Sauvages':'Rhône','Cublize':'Rhône',
      'Tarare':'Rhône','Joux':'Rhône','Machézal':'Rhône',
      'Saint-Clément-sur-Valsonne':'Rhône','Lyon':'Rhône',
      'Saint-Just-la-Pendue':'Loire','Sainte-Colombe-sur-Gand':'Loire',
      'Saint-Colombe':'Loire','Saint-Cyr-de-Valorges':'Loire',
      'Chirassimont':'Loire','Bussières':'Loire','Roanne':'Loire',
      'Saint-Étienne':'Loire','Saint-Etienne':'Loire','Feurs':'Loire','Nervieux':'Loire',
      'Dunières':'Haute-Loire','Montfaucon':'Haute-Loire',
      'Montfaucon-en-Velay':'Haute-Loire','Saint-Pal-de-Mons':'Haute-Loire',
      'Saint-Julien-Molhesabate':'Haute-Loire','Le Puy-en-Velay':'Haute-Loire',
      'Clermont-Ferrand':'Puy-de-Dôme'
    };
    department=placeDepartments[rawPlace]||'';
  }

  if(department){
    const normalized=department.toLowerCase();
    const repo=repositories.find(r=>
      r.url&&String(r.type||'').toLowerCase().includes('département')&&(
        String(r.notes||'').toLowerCase()===normalized||
        String(r.name||'').toLowerCase().includes(normalized)
      )
    );
    if(repo)return {url:repo.url,name:repo.name,level:'departmental'};
  }
  return null;
}

function firstUsefulKnownLine(inv,label){
  const lines=String(inv?.known||'')
    .split('\n')
    .map(line=>line.trim())
    .filter(Boolean)
    .filter(line=>line.toLowerCase().startsWith(label.toLowerCase()+':'))
    .filter(line=>!/date inconnue|lieu inconnu|commune inconnue|à préciser|non renseign/i.test(line));

  if(!lines.length)return'';

  const marriageDates=new Set(
    (inv.logs||[])
      .filter(log=>sourceCategoryFromLog(log)==='marriage')
      .map(log=>log.sourceDetails?.marriageDate||log.foundDate)
      .filter(Boolean)
      .map(fmtDate)
  );

  if(label==='Naissance'){
    const filtered=lines.filter(line=>![...marriageDates].some(date=>line.includes(date)));
    if(filtered.length)return filtered.find(line=>/\d{2}\/\d{2}\/\d{4}/.test(line))||filtered[0];
  }

  return lines.find(line=>/\d{2}\/\d{2}\/\d{4}/.test(line))||lines[0];
}
function usefulEventFromLogs(inv,category){
  const logs=[...(inv.logs||[])].filter(log=>
    ['found','partial','positive'].includes(log.result)&&sourceCategoryFromLog(log)===category
  );

  for(const log of logs){
    const details=log.sourceDetails||{};
    if(category==='birth'){
      const date=details.birthDate||log.foundDate||'';
      const place=details.birthPlace||log.foundPlace||'';
      if(date||place)return {date,place,log,details};
    }
    if(category==='marriage'){
      const date=details.marriageDate||log.foundDate||'';
      const place=details.marriagePlace||log.foundPlace||'';
      if(date||place)return {date,place,log,details};
    }
    if(category==='death'){
      const date=details.deathDate||log.foundDate||'';
      const place=details.deathPlace||log.foundPlace||'';
      if(date||place)return {date,place,log,details};
    }
  }
  return null;
}
function usefulChildrenFacts(inv){
  const facts=[];
  const seen=new Set();

  const add=text=>{
    const clean=String(text||'').replace(/\s+/g,' ').trim();
    if(!clean)return;
    const key=normalizeKnownFactKey(clean);
    if(seen.has(key))return;
    seen.add(key);
    facts.push(clean);
  };

  for(const line of String(inv.known||'').split('\n').map(x=>x.trim()).filter(Boolean)){
    if(/^naissance de l[’']enfant/i.test(line)||
       /^mariage de l[’']enfant/i.test(line)||
       /^décès de l[’']enfant/i.test(line)){
      add(line);
    }
  }

  for(const log of inv.logs||[]){
    if(!['found','partial','positive'].includes(log.result))continue;
    const category=sourceCategoryFromLog(log);
    const details=log.sourceDetails||{};
    const child=details.childName||'enfant non nommé';
    const date=details.childEventDate||log.foundDate||'';
    const place=details.childEventPlace||log.foundPlace||'';

    if(category==='child-birth'){
      add(`Naissance de l’enfant ${child}${date?` : ${fmtDate(date)}`:''}${place?` à ${place}`:''}`);
    }else if(category==='child-marriage'){
      add(`Mariage de l’enfant ${child}${date?` : ${fmtDate(date)}`:''}${place?` à ${place}`:''}`);
    }else if(category==='child-death'){
      add(`Décès de l’enfant ${child}${date?` : ${fmtDate(date)}`:''}${place?` à ${place}`:''}`);
    }
  }

  return facts;
}
function usefulCensusFacts(inv){
  const facts=[];
  const seen=new Set();

  const add=text=>{
    const clean=String(text||'').replace(/\s+/g,' ').trim();
    if(!clean)return;
    const key=normalizeKnownFactKey(clean);
    if(seen.has(key))return;
    seen.add(key);
    facts.push(clean);
  };

  for(const line of String(inv.known||'').split('\n').map(x=>x.trim()).filter(Boolean)){
    if(/recensement/i.test(line))add(line);
  }

  for(const log of inv.logs||[]){
    if(!['found','partial','positive'].includes(log.result))continue;
    if(sourceCategoryFromLog(log)!=='census')continue;
    const details=log.sourceDetails||{};
    const year=details.censusYear||'année non précisée';
    const address=details.address||'';
    const spouse=details.spouse||'';
    const household=String(details.household||'').replace(/\n+/g,', ').trim();
    const people=[spouse,household].filter(Boolean).join(', ');

    add(`Recensement de ${year}${address?` : ${address}`:''}${people?` — avec ${people}`:''}`);
  }

  return facts;
}
function classifiedUsefulFactsHtml(inv){
  const birthLog=usefulEventFromLogs(inv,'birth');
  const marriageLog=usefulEventFromLogs(inv,'marriage');
  const deathLog=usefulEventFromLogs(inv,'death');

  const birthLine=birthLog
    ?`Naissance : ${birthLog.date?fmtDate(birthLog.date):'date non précisée'}${birthLog.place?` à ${birthLog.place}`:''}`
    :firstUsefulKnownLine(inv,'Naissance');

  const marriageLine=marriageLog
    ?`Mariage : ${marriageLog.date?fmtDate(marriageLog.date):'date non précisée'}${marriageLog.place?` à ${marriageLog.place}`:''}`
    :firstUsefulKnownLine(inv,'Mariage');

  const deathLine=deathLog
    ?`Décès : ${deathLog.date?fmtDate(deathLog.date):'date non précisée'}${deathLog.place?` à ${deathLog.place}`:''}`
    :firstUsefulKnownLine(inv,'Décès');

  const marriageDetails=[];
  if(marriageLog){
    const d=marriageLog.details||{};
    const log=marriageLog.log||{};
    const targetIsFemale=Number(inv.sosa)%2===1;
    const age=targetIsFemale
      ?(log.wifeAgeInAct||d.wifeAgeInAct)
      :(log.husbandAgeInAct||d.husbandAgeInAct);

    if(age)marriageDetails.push(`Âge de ${inv.person||'la personne'} : ${age} ans`);
    if(d.husbandContext)marriageDetails.push(`Époux : ${d.husbandContext}`);
    if(d.wifeContext)marriageDetails.push(`Épouse : ${d.wifeContext}`);
    if(d.marriageAttachments)marriageDetails.push(`Mention complémentaire : ${d.marriageAttachments}`);
  }

  const children=usefulChildrenFacts(inv);
  const censuses=usefulCensusFacts(inv);

  const section=(title,items)=>{
    const clean=items.filter(Boolean);
    if(!clean.length)return'';
    return `<section class="reason-box" style="margin-top:10px">
      <strong>${esc(title)}</strong>
      <ul style="margin:8px 0 0;padding-left:20px">
        ${clean.map(item=>`<li>${esc(item)}</li>`).join('')}
      </ul>
    </section>`;
  };

  return `
    ${section('Naissance',[birthLine])}
    ${section('Mariage',[marriageLine,...marriageDetails])}
    ${section('Enfants',children)}
    ${section('Recensements',censuses)}
    ${section('Décès',[deathLine])}
    ${(!birthLine&&!marriageLine&&!children.length&&!censuses.length&&!deathLine)
      ?'<div class="empty">Aucune information utile enregistrée.</div>':''}
  `;
}

function generatePlan(inv){
  const steps=[];
  const period=[inv.periodStart,inv.periodEnd].filter(Boolean).join('–');
  const places=inv.places||[];
  places.forEach((p,i)=>steps.push({id:uid('step'),title:`Consulter les tables décennales et registres de ${p}`,type:'Registre',place:p,period,status:'todo'}));
  steps.push({id:uid('step'),title:'Vérifier les actes des enfants et des parents pour trouver des mentions indirectes',type:'Recoupement',place:places[0]||'',period,status:'todo'});
  steps.push({id:uid('step'),title:'Comparer les anciennes sauvegardes, arbres familiaux ou fichiers GEDCOM disponibles',type:'Comparaison',place:'',period:'',status:'todo'});
  steps.push({id:uid('step'),title:'Consigner les résultats négatifs avant de changer de piste',type:'Méthode',place:'',period:'',status:'todo'});
  return steps;
}

function exportData(){
  try{
    const payload=normalizePistoriaData(cloneData(data));
    payload.exportedAt=new Date().toISOString();

    const blob=new Blob(
      [JSON.stringify(payload,null,2)],
      {type:'application/json'}
    );
    const url=URL.createObjectURL(blob);
    const link=document.createElement('a');
    link.href=url;
    link.download=`pistoria-sauvegarde-${today()}.json`;
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(()=>URL.revokeObjectURL(url),1000);

    storageSet(PISTORIA_EXPORT_COUNT_KEY,'0');
    storageSet(
      PISTORIA_RESOLVED_SNAPSHOT_KEY,
      JSON.stringify(pistoriaResolvedIds())
    );
    updatePistoriaExportAlert();

    console.error('Export Pistoria impossible',error);

function correctMilitaryStepsBySosa(payload){
  const investigations=Array.isArray(payload?.investigations)?payload.investigations:[];
  const audit=Array.isArray(payload?.audit)?payload.audit:[];

  const namesBySosa=new Map();
  for(const inv of investigations){
    const sosa=Number(inv.sosa);
    if(Number.isFinite(sosa)&&inv.person)namesBySosa.set(sosa,inv.person);
  }
  for(const item of audit){
    const sosa=Number(item.sosa);
    if(Number.isFinite(sosa)&&item.name&&!namesBySosa.has(sosa)){
      namesBySosa.set(sosa,item.name);
    }
  }

  for(const inv of investigations){
    const sosa=Number(inv.sosa);
    if(!Number.isInteger(sosa)||sosa<=1||sosa%2===0)continue;

    const spouseSosa=sosa-1;
    const spouseName=namesBySosa.get(spouseSosa)||'son époux';

    for(const step of inv.steps||[]){
      const text=`${step.type||''} ${step.sourceCategory||''} ${step.title||''}`.toLowerCase();
      if(!text.includes('matricule militaire'))continue;

      step.title=`Examiner le matricule militaire de ${spouseName}, époux de ${inv.person||'la personne recherchée'}`;
      step.type='Matricule militaire du conjoint — piste indirecte';
      step.sourceCategory='Registre matricule militaire — conjoint';
      step.reason=`${inv.person||'La personne recherchée'} ne possède pas de matricule militaire. Celui de ${spouseName} peut néanmoins indiquer ses domiciles successifs, la date ou le lieu du mariage et d’autres renseignements permettant de retrouver l’acte de mariage du couple.`;
      step.instructions=`Recherche ${spouseName} dans la classe correspondant approximativement à son année de naissance + 20. Relève les domiciles, la date et le lieu du mariage, ainsi que toute mention familiale. Utilise ensuite ces indices pour retrouver l’acte de mariage, qui pourra préciser la naissance de ${inv.person||'la personne recherchée'}.`;
      step.indirectEvidence=true;
      step.relatedSosa=spouseSosa;
      step.relatedPerson=spouseName;
    }
  }

  return payload;
}


const PISTORIA_RULE_ENGINE_VERSION='2.0.0';
function normText(value){return String(value||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’']/g,"'").toLowerCase()}
function firstYear(value){const m=String(value||'').match(/\b(1[5-9]\d{2}|20\d{2})\b/);return m?Number(m[1]):null}
function investigationTarget(inv){
  const missing=(inv.missingSummary||[]).join(' ').toLowerCase();
  if(missing.includes('naissance'))return'birth';
  if(missing.includes('mariage'))return'marriage';
  if(missing.includes('décès')||missing.includes('deces'))return'death';
  return'unknown'
}
function extractStructuredClues(inv){
  const clues=[],seen=new Set();
  const add=clue=>{if(!clue?.type)return;const sig=JSON.stringify([clue.type,clue.date||'',clue.year||'',clue.place||'',clue.person||'',clue.sourceId||'']);if(!seen.has(sig)){seen.add(sig);clues.push(clue)}};
  for(const line of String(inv.known||'').split('\n').filter(Boolean)){
    const year=firstYear(line),date=parseFrenchDateFromText(line),place=(line.match(/\sà\s(.+)$/i)||[])[1]||'';
    if(/^naissance\s*:/i.test(line))add({type:'target-birth',date,year,place,summary:line,certainty:'strong'});
    else if(/^mariage\s*:/i.test(line))add({type:'target-marriage',date,year,place,summary:line,certainty:'strong'});
    else if(/^décès\s*:/i.test(line))add({type:'target-death',date,year,place,summary:line,certainty:'strong'});
    else if(/naissance de l[’']enfant/i.test(line))add({type:'child-birth',date,year,place,summary:line,certainty:'strong'});
    else if(/recensement/i.test(line))add({type:'census-presence',year,place,summary:line,certainty:'strong'});
  }
  for(const log of inv.logs||[]){
    if(log.structuredClue?.type)add({...log.structuredClue,year:firstYear(log.structuredClue.date),source:log.source||'Journal',sourceId:log.id||'',summary:log.notes||''});
    const d=log.sourceDetails||{},source=log.source||log.stepTitle||'Journal',sourceId=log.id||'';
    if(d.childEventDate||d.childName)add({type:'child-birth',date:d.childEventDate||'',year:firstYear(d.childEventDate),place:d.childEventPlace||'',person:d.childName||'',address:d.parentsAddress||'',parentAge:Number(d.targetParentAge)||null,source,sourceId,summary:log.notes||''});
    if(d.censusYear||d.household)add({type:'census-presence',year:firstYear(d.censusYear),place:d.address||'',spouse:d.spouse||'',household:d.household||'',occupation:d.occupation||'',source,sourceId,summary:log.notes||''});
    if(d.marriageDate||d.marriagePlace)add({type:'target-marriage',date:d.marriageDate||'',year:firstYear(d.marriageDate),place:d.marriagePlace||'',source,sourceId});
    if(d.birthDate||d.birthPlace)add({type:'target-birth',date:d.birthDate||'',year:firstYear(d.birthDate),place:d.birthPlace||'',source,sourceId});
    if(d.deathDate||d.deathPlace)add({type:'target-death',date:d.deathDate||'',year:firstYear(d.deathDate),place:d.deathPlace||'',source,sourceId});
    if(d.targetParentStatus)add({type:d.targetParentStatus==='alive'?'person-alive':d.targetParentStatus==='deceased'?'person-deceased':'person-status',year:firstYear(d.childEventDate||log.actDate||log.date),place:d.targetParentResidence||d.childEventPlace||'',source,sourceId,summary:d.targetParentClue||log.notes||''});
    if(log.result==='negative')add({type:'negative-search',year:firstYear(log.date),source,sourceId,summary:log.notes||''});
  }
  inv.structuredClues=clues;return clues
}
function communeHistoryEntries(payload){return Array.isArray(payload.communeHistory)?payload.communeHistory:[]}
function communeHistoryNotice(place,year,payload){
  const n=normText(place);if(!n)return null;
  return communeHistoryEntries(payload).find(e=>[e.oldName,...(e.aliases||[]),e.currentName].map(normText).includes(n)&&(!year||!e.changeYear||year<=e.changeYear))||null
}
function decorateStepWithCommuneHistory(step,payload){
  const h=communeHistoryNotice(step.place,firstYear(step.period||step.title||''),payload);if(!h)return step;
  step.communeHistory=h;
  const msg=`À la date recherchée, « ${h.oldName} » était une commune distincte. Elle a été rattachée à ${h.currentName} en ${h.changeYear}. Cherche sous l’ancien nom, mais vérifie aussi le classement sous ${h.currentName}.`;
  if(!String(step.reason||'').includes('commune distincte'))step.reason=[step.reason,msg].filter(Boolean).join(' ');
  return step
}
function knownBirthYear(inv){const c=(inv.structuredClues||[]).find(x=>x.type==='target-birth'&&x.year);return c?.year||firstYear(knownFact(inv,'Naissance'))}
function possibleDeathAfter1970(inv){const d=firstYear(knownFact(inv,'Décès'));if(d)return d>=1970;const b=knownBirthYear(inv);return !!b&&b+70>=1970}
function militaryClassForInvestigation(inv,payload){
  const s=Number(inv.sosa),selfMale=Number.isInteger(s)&&s%2===0,targetSosa=selfMale?s:s-1;
  const target=(payload.investigations||[]).find(x=>Number(x.sosa)===targetSosa);
  const targetName=target?.person||(selfMale?inv.person:'son époux');
  const birthYear=target?knownBirthYear(target):(selfMale?knownBirthYear(inv):null);
  return {eligible:selfMale||!!target,targetName,birthYear,classYear:birthYear?birthYear+20:null}
}

}

function ensureV5Investigation(inv){
  inv.censusEvidence=Array.isArray(inv.censusEvidence)?inv.censusEvidence:[];
  inv.coverageMatrix=Array.isArray(inv.coverageMatrix)?inv.coverageMatrix:[];
  inv.contradictions=Array.isArray(inv.contradictions)?inv.contradictions:[];
  inv.identityVariants=Array.isArray(inv.identityVariants)?inv.identityVariants:[inv.person||''];
  inv.identityCandidates=Array.isArray(inv.identityCandidates)?inv.identityCandidates:[];
  inv.witnessNetwork=Array.isArray(inv.witnessNetwork)?inv.witnessNetwork:[];
  inv.revisitQueue=Array.isArray(inv.revisitQueue)?inv.revisitQueue:[];
  inv.structuredTimeline=Array.isArray(inv.structuredTimeline)?inv.structuredTimeline:[];
  inv.sourceAvailability=Array.isArray(inv.sourceAvailability)?inv.sourceAvailability:[];
  inv.researchMetrics=(inv.researchMetrics&&typeof inv.researchMetrics==='object')?inv.researchMetrics:{};
  inv.proofConclusion=(inv.proofConclusion&&typeof inv.proofConclusion==='object')?inv.proofConclusion:{};
  return inv;
}
function reliabilityWeight(s){const t=normText(`${s?.sourceCategory||''} ${s?.type||''} ${s?.title||''}`);if(/acte original|registre original|etat civil|paroissial/.test(t))return 1;if(/recensement|matricule|notarial|succession/.test(t))return .8;if(/releve|index|geneanet|insee/.test(t))return .6;if(/arbre|hypothese/.test(t))return .35;return .5}
function stepInformationValue(s){const t=normText(`${s?.title||''} ${s?.reason||''}`);if(/acte de naissance|acte de mariage|acte de deces/.test(t))return 10;if(/recensement|succession|notarial|matricule/.test(t))return 8;if(/geneanet|index|table decennale/.test(t))return 6;return 5}
function stepSuccessProbability(s,inv){let p=.45;const t=normText(`${s?.title||''} ${s?.reason||''}`);if(/annee et commune|acte deja localise/.test(t))p=.9;else if(/table decennale/.test(t))p=.72;else if(/geneanet/.test(t))p=.48;else if(/recensement/.test(t))p=(inv.censusEvidence||[]).length?.82:.55;else if(/commune voisine|elargir/.test(t))p=.28;return p}
function stepYieldScore(s,inv){const m=Math.max(3,Number(s.estimatedMinutes||10));return Math.round(stepSuccessProbability(s,inv)*stepInformationValue(s)*reliabilityWeight(s)/m*100)}
function detectV5Contradictions(inv){const x=[];const b=knownDate(inv,'Naissance'),m=knownDate(inv,'Mariage'),d=knownDate(inv,'Décès');if(b&&m&&dateValue(m)<dateValue(b))x.push({severity:'critique',title:'Mariage antérieur à la naissance'});if(b&&d&&dateValue(d)<dateValue(b))x.push({severity:'critique',title:'Décès antérieur à la naissance'});const ys=(inv.censusEvidence||[]).map(c=>Number(String(c.birthInfo||'').match(/\d{4}/)?.[0])).filter(Boolean);if(ys.length&&b&&Math.max(...ys.map(y=>Math.abs(y-dateYear(b))))>2)x.push({severity:'moyenne',title:'Années de naissance divergentes dans les recensements',detail:[...new Set(ys)].join(', ')});inv.contradictions=x;return x}

function knownLineFor(inv,label){
  return String(inv?.known||'')
    .split('\n')
    .find(line=>line.trim().toLowerCase().startsWith(label.toLowerCase()+':'))||'';
}
function knownLineHasExactDate(inv,label){
  return /\b\d{2}\/\d{2}\/\d{4}\b/.test(knownLineFor(inv,label));
}
function knownLineHasUsablePlace(inv,label){
  const line=knownLineFor(inv,label);
  const place=(line.match(/\sà\s(.+)$/i)||[])[1]||'';
  return !!place && !/inconn|à préciser|non renseign/i.test(place);
}

function targetEventFromMissing(inv){
  const text=(inv?.missingSummary||[]).join(' ').toLowerCase();
  if(text.includes('naissance'))return'birth';
  if(text.includes('mariage'))return'marriage';
  if(text.includes('décès')||text.includes('deces'))return'death';
  return'';
}
function logText(log){
  return `${log?.source||''} ${log?.notes||''} ${log?.stepTitle||''} ${JSON.stringify(log?.sourceDetails||{})}`.toLowerCase();
}
function logSupportsEvent(log,event){
  if(!['found','partial','positive'].includes(log?.result))return false;
  const text=logText(log);
  const details=log?.sourceDetails||{};

  if(event==='birth'){
    return !!details.birthDate ||
      /acte de naissance|date de naissance|né[e]?\s+le|baptême|bapteme/.test(text);
  }
  if(event==='marriage'){
    return !!details.marriageDate ||
      /acte de mariage|date du mariage|marié[e]?\s+le|contrat de mariage/.test(text);
  }
  if(event==='death'){
    return !!details.deathDate ||
      /acte de décès|acte de deces|date du décès|date du deces|décédé[e]?\s+le|decede[e]?\s+le|sépulture|sepulture/.test(text);
  }
  return false;
}
function bestJournalProof(inv,event){
  const logs=[...(inv?.logs||[])].sort((a,b)=>
    String(b.createdAt||b.date||'').localeCompare(String(a.createdAt||a.date||''))
  );
  return logs.find(log=>{
    if(!logSupportsEvent(log,event))return false;
    const details=log.sourceDetails||{};
    if(event==='birth')return !!(details.birthDate||log.foundDate);
    if(event==='marriage')return !!(details.marriageDate||log.foundDate);
    if(event==='death')return !!(details.deathDate||log.foundDate);
    return false;
  })||null;
}
function proofDateAndPlace(log,event){
  const details=log?.sourceDetails||{};
  if(event==='birth'){
    return {
      date:details.birthDate||log?.foundDate||'',
      place:details.birthPlace||log?.foundPlace||''
    };
  }
  if(event==='marriage'){
    return {
      date:details.marriageDate||log?.foundDate||'',
      place:details.marriagePlace||log?.foundPlace||''
    };
  }
  if(event==='death'){
    return {
      date:details.deathDate||log?.foundDate||'',
      place:details.deathPlace||log?.foundPlace||''
    };
  }
  return {date:'',place:''};
}
function replaceKnownEventLine(inv,label,date,place){
  const formatted=date?fmtDate(date):'';
  if(!formatted)return;

  const newLine=`${label} : ${formatted}${place?` à ${place}`:''}`;
  const lines=String(inv.known||'').split('\n').filter(Boolean);
  const filtered=lines.filter(line=>{
    if(!line.trim().toLowerCase().startsWith(label.toLowerCase()+':'))return true;
    return false;
  });

  const completeIndex=filtered.findIndex(line=>
    line.trim().toLowerCase().startsWith('à compléter')
  );
  if(completeIndex>=0)filtered.splice(completeIndex,0,newLine);
  else filtered.unshift(newLine);

  inv.known=filtered.join('\n');
}

function reconcileInvestigationResolution(inv){
  const missing=Array.isArray(inv.missingSummary)?inv.missingSummary:[];
  const targetEvent=targetEventFromMissing(inv);
  const journalProof=targetEvent?bestJournalProof(inv,targetEvent):null;

  if(journalProof){
    const proof=proofDateAndPlace(journalProof,targetEvent);
    const label=targetEvent==='birth'?'Naissance':targetEvent==='marriage'?'Mariage':'Décès';
    replaceKnownEventLine(inv,label,proof.date,proof.place);
  }

  const remaining=[];

  for(const item of missing){
    const text=String(item||'').toLowerCase();
    let unresolved=text;

    if(text.includes('naissance')){
      if(knownLineHasExactDate(inv,'Naissance')){
        unresolved=unresolved
          .replace(/date exacte(?: de la naissance)?/gi,'')
          .replace(/date de naissance/gi,'');
      }
      if(knownLineHasUsablePlace(inv,'Naissance')){
        unresolved=unresolved
          .replace(/commune précise(?: de la naissance)?/gi,'')
          .replace(/commune de naissance/gi,'')
          .replace(/lieu de naissance/gi,'');
      }
    }

    if(text.includes('mariage')){
      if(knownLineHasExactDate(inv,'Mariage')){
        unresolved=unresolved
          .replace(/date exacte(?: du mariage)?/gi,'')
          .replace(/date du mariage/gi,'');
      }
      if(knownLineHasUsablePlace(inv,'Mariage')){
        unresolved=unresolved
          .replace(/commune précise(?: du mariage)?/gi,'')
          .replace(/commune du mariage/gi,'')
          .replace(/lieu du mariage/gi,'');
      }
    }

    if(text.includes('décès')||text.includes('deces')){
      if(knownLineHasExactDate(inv,'Décès')){
        unresolved=unresolved
          .replace(/date exacte(?: du décès)?/gi,'')
          .replace(/date du décès/gi,'')
          .replace(/date du deces/gi,'');
      }
      if(knownLineHasUsablePlace(inv,'Décès')){
        unresolved=unresolved
          .replace(/commune précise(?: du décès)?/gi,'')
          .replace(/commune du décès/gi,'')
          .replace(/commune du deces/gi,'')
          .replace(/lieu du décès/gi,'')
          .replace(/lieu du deces/gi,'');
      }
    }

    unresolved=unresolved
      .replace(/^(naissance|mariage|décès|deces)\s*:\s*/i,'')
      .replace(/^[\s,;:]+|[\s,;:]+$/g,'')
      .replace(/\s{2,}/g,' ');

    if(unresolved){
      const prefix=text.includes('naissance')?'naissance'
        :text.includes('mariage')?'mariage'
        :(text.includes('décès')||text.includes('deces'))?'décès':'';
      remaining.push(prefix?`${prefix} : ${unresolved}`:String(item));
    }
  }

  inv.missingSummary=remaining;

  if(!remaining.length){
    inv.status='closed';
    inv.classifiedAt=inv.classifiedAt||new Date().toISOString();
    inv.classificationReason=inv.classificationReason||'fait recherché retrouvé dans les indices connus';

    const lines=String(inv.known||'')
      .split('\n')
      .filter(line=>line && !line.trim().toLowerCase().startsWith('à compléter'));
    if(!lines.some(line=>/fiche complétée/i.test(line))){
      lines.push('Fiche complétée avec les résultats enregistrés dans Pistoria.');
    }
    inv.known=lines.join('\n');
  }

  return inv;
}


function normalizeKnownFactKey(line){
  return String(line||'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .replace(/\s+/g,' ')
    .trim();
}
function exactDatesForJournalCategory(inv,category){
  const dates=new Set();
  for(const log of inv.logs||[]){
    if(sourceCategoryFromLog(log)!==category)continue;
    const details=log.sourceDetails||{};
    const value=category==='birth'
      ?(details.birthDate||log.foundDate)
      :category==='marriage'
        ?(details.marriageDate||log.foundDate)
        :(details.deathDate||log.foundDate);
    if(value)dates.add(fmtDate(value));
  }
  return dates;
}
function sanitizeKnownFacts(inv){
  const raw=String(inv.known||'').split('\n').map(line=>line.trim()).filter(Boolean);
  const unique=[];
  const seen=new Set();

  for(const line of raw){
    const key=normalizeKnownFactKey(line);
    if(seen.has(key))continue;
    seen.add(key);
    unique.push(line);
  }

  const marriageDates=exactDatesForJournalCategory(inv,'marriage');
  const birthDates=exactDatesForJournalCategory(inv,'birth');
  const deathDates=exactDatesForJournalCategory(inv,'death');

  const labels=['Naissance','Mariage','Décès'];
  const keptOther=unique.filter(line=>!labels.some(label=>
    line.toLowerCase().startsWith(label.toLowerCase()+':')
  ));

  const selected=[];

  for(const label of labels){
    let lines=unique.filter(line=>
      line.toLowerCase().startsWith(label.toLowerCase()+':')
    );

    // Supprimer une date de mariage qui avait été rangée par erreur en naissance.
    if(label==='Naissance'&&marriageDates.size){
      lines=lines.filter(line=>![...marriageDates].some(date=>line.includes(date)));
    }

    const journalDates=label==='Naissance'
      ?birthDates
      :label==='Mariage'
        ?marriageDates
        :deathDates;

    if(journalDates.size){
      const journalLine=lines.find(line=>[...journalDates].some(date=>line.includes(date)));
      if(journalLine){
        selected.push(journalLine);
        continue;
      }
    }

    const exact=lines.filter(line=>/\b\d{2}\/\d{2}\/\d{4}\b/.test(line));
    if(exact.length){
      selected.push(exact[0]);
      continue;
    }

    const useful=lines.find(line=>
      !/date inconnue|lieu inconnu|commune inconnue|à préciser|non renseign/i.test(line)
    );
    if(useful)selected.push(useful);
  }

  inv.known=[...selected,...keptOther].join('\n');
  return inv;
}

function normalizePistoriaData(payload){
  const normalized=(payload&&typeof payload==='object')?payload:{};

  normalized.investigations=Array.isArray(normalized.investigations)?normalized.investigations:[];
  normalized.comparisons=Array.isArray(normalized.comparisons)?normalized.comparisons:[];
  normalized.repositories=Array.isArray(normalized.repositories)?normalized.repositories:[];
  normalized.anomalies=Array.isArray(normalized.anomalies)?normalized.anomalies:[];
  normalized.researchQueue=Array.isArray(normalized.researchQueue)?normalized.researchQueue:[];
  normalized.settings=(normalized.settings&&typeof normalized.settings==='object')?normalized.settings:{};
  normalized.audit=(normalized.audit&&typeof normalized.audit==='object')?normalized.audit:{};
  normalized.evidenceMemory=(normalized.evidenceMemory&&typeof normalized.evidenceMemory==='object')
    ?normalized.evidenceMemory:{people:{},families:[]};

  normalized.evidenceMemory.people=(normalized.evidenceMemory.people&&typeof normalized.evidenceMemory.people==='object')
    ?normalized.evidenceMemory.people:{};
  normalized.evidenceMemory.families=Array.isArray(normalized.evidenceMemory.families)
    ?normalized.evidenceMemory.families:[];

  for(const inv of normalized.investigations){
    ensureV5Investigation(inv);
    inv.steps=Array.isArray(inv.steps)?inv.steps:[];
    inv.logs=Array.isArray(inv.logs)?inv.logs:[];
    inv.hypotheses=Array.isArray(inv.hypotheses)?inv.hypotheses:[];
    inv.missingSummary=Array.isArray(inv.missingSummary)
      ?inv.missingSummary
      :(typeof inv.missingSummary==='string'&&inv.missingSummary.trim()
        ?[inv.missingSummary.trim()]
        :[]);
    for(const step of inv.steps){
      step.targetFields=Array.isArray(step.targetFields)?step.targetFields:[];
    }
    sanitizeKnownFacts(inv);
    reconcileInvestigationResolution(inv);
    sanitizeKnownFacts(inv);
  }

  correctMilitaryStepsBySosa(normalized);
  recalculateAllPlans(normalized);
  return normalized;
}

const ARBORIS_SYNC_BACKUP_KEY='pistoria_arboris_sync_backup';
const ARBORIS_SYNC_LOG_KEY='pistoria_arboris_sync_log';

function arborisSyncNorm(s){
  return String(s||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
}
function arborisSyncLevenshtein(a,b){
  a=a||'';b=b||'';
  const m=[];
  for(let i=0;i<=a.length;i++)m[i]=[i];
  for(let j=0;j<=b.length;j++)m[0][j]=j;
  for(let i=1;i<=a.length;i++)for(let j=1;j<=b.length;j++){
    m[i][j]=a[i-1]===b[j-1]?m[i-1][j-1]:1+Math.min(m[i-1][j-1],m[i][j-1],m[i-1][j]);
  }
  return m[a.length][b.length];
}
function extractArborisSnapshot(person){
  return{
    firstNames:person.firstNames||'',
    lastName:person.lastName||'',
    sex:person.sex||'',
    birthDate:person.birth?.date||'',
    birthPlace:person.birth?.commune||person.birth?.place||'',
    deathDate:person.death?.date||'',
    deathPlace:person.death?.commune||person.death?.place||'',
    parentFamilyId:person.parentFamilyId||''
  };
}
function arborisSnapshotsEqual(a,b){
  if(!a||!b)return false;
  return['firstNames','lastName','sex','birthDate','birthPlace','deathDate','deathPlace','parentFamilyId']
    .every(k=>(a[k]||'')===(b[k]||''));
}
function arborisSyncYearFrom(text){
  const m=String(text||'').match(/\b(1[5-9]\d{2}|20\d{2})\b/);
  return m?Number(m[1]):null;
}
/**
 * Vérifie que le Sosa correspond toujours à la même personne avant toute mise à jour.
 * Retourne une chaîne expliquant le conflit, ou '' si l'identité est cohérente
 * (ou si les données disponibles ne permettent aucune comparaison, auquel cas
 * on laisse passer plutôt que de bloquer sans preuve).
 */
function investigationIdentityConflict(inv,person){
  const newLast=arborisSyncNorm(person.lastName);
  const priorSnapshot=inv.arborisSync?.snapshot;
  const priorLast=arborisSyncNorm(priorSnapshot?priorSnapshot.lastName:(inv.person||'').split(' ').slice(-1)[0]);
  if(priorLast&&newLast){
    const closeEnough=priorLast===newLast||arborisSyncLevenshtein(priorLast,newLast)<=2;
    if(!closeEnough){
      return`Nom de famille très différent de celui déjà enregistré : « ${priorSnapshot?priorSnapshot.lastName:inv.person} » vs « ${person.lastName} ».`;
    }
  }
  const priorBirthYear=priorSnapshot?arborisSyncYearFrom(priorSnapshot.birthDate):arborisSyncYearFrom(knownFact(inv,'Naissance'));
  const newBirthYear=arborisSyncYearFrom(person.birth?.date);
  if(priorBirthYear&&newBirthYear&&Math.abs(priorBirthYear-newBirthYear)>2){
    return`Année de naissance très différente de celle déjà enregistrée : ${priorBirthYear} vs ${newBirthYear}.`;
  }
  return'';
}
function buildStarterInvestigation(sosa,person){
  const name=`${person.firstNames||''} ${person.lastName||''}`.trim()||'(nom inconnu)';
  const snapshot=extractArborisSnapshot(person);
  const knownLines=[];
  if(snapshot.birthDate)knownLines.push(`Naissance : ${fmtDate(snapshot.birthDate)}${snapshot.birthPlace?` à ${snapshot.birthPlace}`:''}`);
  if(snapshot.deathDate)knownLines.push(`Décès : ${fmtDate(snapshot.deathDate)}${snapshot.deathPlace?` à ${snapshot.deathPlace}`:''}`);
  const inv={
    id:`investigation_sosa_${sosa}`,
    title:`Enquête — Sosa ${sosa} · ${name}`,
    person:name,
    personId:person.id||'',
    sosa,
    kind:'long',
    objective:`Compléter les champs encore manquants de la fiche de ${name} dans Arboris.`,
    known:knownLines.join('\n'),
    missingSummary:[],
    status:'active',
    priority:'normal',
    priorityRank:sosa,
    createdAt:today(),
    steps:[buildGeneanetStep({person:name},null)],
    logs:[],
    strategyNote:'',
    calculationAdvice:'',
    scope:'sosa-only',
    subjectType:'direct-ancestor',
    hypotheses:[],
    censusEvidence:[],
    identityVariants:[],
    coverageMatrix:[],
    contradictions:[],
    identityCandidates:[],
    witnessNetwork:[],
    revisitQueue:[],
    sourceAvailability:[],
    proofConclusion:{},
    researchMetrics:{},
    structuredTimeline:[],
    structuredClues:[],
    ruleEngine:{},
    arborisSync:{lastSyncedAt:new Date().toISOString(),snapshot,missing:false,missingSince:'',identityConflict:false,conflictNote:''}
  };
  return inv;
}
/**
 * Calcule un aperçu de ce que ferait une synchronisation, sans rien modifier.
 * payload = un export Arboris standard tel quel (people, families, ...).
 */
function computeArborisSyncPreview(payload){
  if(!payload||!Array.isArray(payload.people)){
    return{error:'Ce fichier ne ressemble pas à un export Arboris (aucune liste "people" trouvée).'};
  }
  const arborisBySosa=new Map();
  for(const p of payload.people){
    if(Number.isInteger(p.sosa)&&p.sosa>0)arborisBySosa.set(p.sosa,p);
  }
  const existingBySosa=new Map();
  for(const inv of data.investigations||[]){
    if(Number.isInteger(inv.sosa))existingBySosa.set(inv.sosa,inv);
  }

  const newSosa=[],updatedSosa=[],missingSosa=[],conflicts=[];
  let unchangedCount=0;

  for(const[sosa,inv]of existingBySosa){
    const person=arborisBySosa.get(sosa);
    if(!person){
      missingSosa.push({sosa,inv});
      continue;
    }
    const conflictReason=investigationIdentityConflict(inv,person);
    if(conflictReason){
      conflicts.push({sosa,inv,person,reason:conflictReason});
      continue;
    }
    const newSnapshot=extractArborisSnapshot(person);
    if(arborisSnapshotsEqual(inv.arborisSync?.snapshot,newSnapshot)){
      unchangedCount++;
    }else{
      updatedSosa.push({sosa,inv,person,snapshot:newSnapshot});
    }
  }
  for(const[sosa,person]of arborisBySosa){
    if(!existingBySosa.has(sosa))newSosa.push({sosa,person});
  }

  return{newSosa,updatedSosa,missingSosa,conflicts,unchangedCount,sourceCount:arborisBySosa.size};
}

/**
 * Applique un aperçu déjà calculé. Ne touche jamais aux enquêtes en conflit
 * ou absentes autrement que pour les signaler. Ne supprime jamais d'enquête.
 */
function applyArborisSyncPreview(preview,sourceFileName){
  const backupPayload={
    takenAt:new Date().toISOString(),
    sourceFileName:sourceFileName||'',
    snapshot:cloneData(data)
  };
  try{storageSet(ARBORIS_SYNC_BACKUP_KEY,JSON.stringify(backupPayload));}
  catch(e){console.error('Sauvegarde avant synchronisation impossible',e);}

  for(const{inv,person,snapshot}of preview.updatedSosa){
    inv.arborisSync=inv.arborisSync||{};
    inv.arborisSync.snapshot=snapshot;
    inv.arborisSync.lastSyncedAt=new Date().toISOString();
    inv.arborisSync.missing=false;
    inv.arborisSync.missingSince='';
    inv.personId=person.id||inv.personId;
    inv.person=`${person.firstNames||''} ${person.lastName||''}`.trim()||inv.person;
    inv.title=`Enquête — Sosa ${inv.sosa} · ${inv.person}`;
  }
  for(const{inv}of preview.missingSosa){
    inv.arborisSync=inv.arborisSync||{};
    if(!inv.arborisSync.missing){
      inv.arborisSync.missing=true;
      inv.arborisSync.missingSince=today();
    }
  }
  for(const{inv,reason}of preview.conflicts){
    inv.arborisSync=inv.arborisSync||{};
    inv.arborisSync.identityConflict=true;
    inv.arborisSync.conflictNote=reason;
  }
  const createdInvestigations=[];
  for(const{sosa,person}of preview.newSosa){
    const inv=buildStarterInvestigation(sosa,person);
    data.investigations.push(inv);
    createdInvestigations.push(inv.id);
  }

  const logEntry={
    at:new Date().toISOString(),
    sourceFileName:sourceFileName||'',
    created:createdInvestigations.length,
    updated:preview.updatedSosa.length,
    missing:preview.missingSosa.length,
    conflicts:preview.conflicts.length,
    unchanged:preview.unchangedCount
  };
  let log=[];
  try{log=JSON.parse(storageGet(ARBORIS_SYNC_LOG_KEY)||'[]');}catch(e){log=[];}
  if(!Array.isArray(log))log=[];
  log.push(logEntry);
  storageSet(ARBORIS_SYNC_LOG_KEY,JSON.stringify(log.slice(-50)));

  saveData();
  return logEntry;
}
function undoLastArborisSync(){
  let backup=null;
  try{backup=JSON.parse(storageGet(ARBORIS_SYNC_BACKUP_KEY)||'null');}catch(e){}
  if(!backup||!backup.snapshot){
    alert('Aucune synchronisation récente à annuler.');
    return false;
  }
  data=backup.snapshot;
  try{storageSet(ARBORIS_SYNC_BACKUP_KEY,'');}catch(e){}
  saveData();
  return true;
}
function enforceSosaOnlyScope(payload){
  if(!payload||typeof payload!=='object')return payload;

  payload.scope=payload.scope||{};
  payload.scope.mode='sosa-only';
  payload.scope.investigateDirectAncestorsOnly=true;
  payload.scope.investigateCollateralRelatives=false;
  payload.scope.investigateNonSosaSpouses=false;
  payload.scope.relativesMayBeUsedAsEvidenceSources=true;

  payload.settings=payload.settings||{};
  payload.settings.investigationScope='sosa-only';

  const people=payload.genealogy?.people;

  // Cas 1 : sauvegarde Pistoria compacte.
  // Elle ne contient volontairement pas genealogy.people, car les enquêtes
  // ont déjà été filtrées sur les Sosa avant l'export.
  // On conserve donc toutes les enquêtes du fichier.
  if(!Array.isArray(people)||people.length===0){
    payload.investigations=Array.isArray(payload.investigations)
      ?payload.investigations
      :[];
    payload.researchQueue=Array.isArray(payload.researchQueue)
      ?payload.researchQueue
      :[];
    payload.anomalies=Array.isArray(payload.anomalies)
      ?payload.anomalies
      :[];
    return payload;
  }

  // Cas 2 : fichier complet contenant l'arbre.
  // Le filtrage Sosa peut alors être effectué de manière fiable.
  const sosaIds=new Set(
    people
      .filter(person=>
        person.directAncestor===true&&
        String(person.sosa??'').trim()!==''
      )
      .map(person=>person.id)
  );

  payload.investigations=(payload.investigations||[]).filter(inv=>
    sosaIds.has(inv.personId)||
    String(inv.sosa??'').trim()!==''
  );

  const keptInvestigationIds=new Set(
    payload.investigations.map(inv=>inv.id)
  );

  payload.researchQueue=(payload.researchQueue||[]).filter(item=>
    sosaIds.has(item.personId)||
    keptInvestigationIds.has(item.investigationId)
  );

  payload.anomalies=(payload.anomalies||[]).filter(item=>
    sosaIds.has(item.entityId)||
    keptInvestigationIds.has(item.investigationId)
  );

  if(payload.proofGraph){
    payload.proofGraph.claims=(payload.proofGraph.claims||[])
      .filter(claim=>sosaIds.has(claim.personId));

    const claimIds=new Set(
      payload.proofGraph.claims.map(claim=>claim.id)
    );

    payload.proofGraph.links=(payload.proofGraph.links||[])
      .filter(link=>claimIds.has(link.claimId));

    const sourceIds=new Set(
      payload.proofGraph.links.map(link=>link.sourceId)
    );

    payload.proofGraph.sources=(payload.proofGraph.sources||[])
      .filter(source=>sourceIds.has(source.id));
  }

  return payload;
}

function backupBeforeImport(){
  try{
    storageSet(BACKUP_KEY,JSON.stringify(data));
  }catch(error){
    console.warn('Sauvegarde avant import impossible',error);
  }
}

function importData(event){
  const input=event.target;
  const file=input.files&&input.files[0];
  if(!file)return;

  const reader=new FileReader();

  reader.onload=()=>{
    try{
      const parsed=JSON.parse(String(reader.result||''));

      if(
        !parsed||
        typeof parsed!=='object'||
        !Array.isArray(parsed.investigations)
      ){
        throw new Error('Format incompatible : aucune liste d’enquêtes.');
      }

      const sourceInvestigationCount=parsed.investigations.length;

      let incoming=normalizePistoriaData(parsed);
      incoming=enforceSosaOnlyScope(incoming);
      incoming=normalizePistoriaData(incoming);

      if(sourceInvestigationCount>0&&incoming.investigations.length===0){
        throw new Error(
          `Le fichier contient ${sourceInvestigationCount} enquête(s), mais le filtrage les a toutes supprimées. L’import est annulé pour protéger les données.`
        );
      }

      const investigations=incoming.investigations.length;
      const steps=incoming.investigations.reduce(
        (sum,inv)=>sum+(inv.steps||[]).length,0
      );
      const results=incoming.investigations.reduce(
        (sum,inv)=>sum+(inv.logs||[]).length,0
      );

      const summary=
        `${investigations} enquête${investigations>1?'s':''}, `+
        `${steps} étape${steps>1?'s':''}, `+
        `${results} résultat${results>1?'s':''}`;

      if(!confirm(
        `Sauvegarde Pistoria détectée : ${summary}.\n\n`+
        `Remplacer les données actuellement chargées ?`
      )){
        return;
      }

      backupBeforeImport();
      data=incoming;

      ensureGeneanetPistes();
      normalizeRepositoryLabelsAndLinks();
      data=normalizePistoriaData(data);

      saveData();
      alert(`Import réussi : ${summary}.`);
    }catch(error){
      console.error('Import Pistoria impossible',error);
      alert('Import impossible : '+(error?.message||'erreur inconnue'));
    }finally{
      input.value='';
    }
  };

  reader.onerror=()=>{
    alert('Import impossible : le fichier n’a pas pu être lu.');
    input.value='';
  };

  reader.readAsText(file);
}

function handleArborisSyncFile(event){
  const file=event.target.files&&event.target.files[0];

function showArborisSyncPreviewModal(preview,payload,fileName){

      <div class="card"><strong>${preview.missingSosa.length}</strong><div>Sosa absent(s) du nouvel export — aucune suppression, à vérifier</div></div>
      <div class="card"><strong>${preview.conflicts.length}</strong><div>conflit(s) d’identité — non modifié(s)</div></div>
    </div>
    <p class="muted">${preview.unchangedCount} enquête(s) déjà à jour, aucun changement.</p>
    ${conflictRows?`<h3>Conflits d’identité (à vérifier manuellement, rien n’est modifié)</h3><ul>${conflictRows}</ul>`:''}
    ${missingRows?`<h3>Sosa absents du nouvel export (enquêtes conservées, à vérifier)</h3><ul>${missingRows}</ul>`:''}
    <p><strong>Vos étapes, statuts, résultats, notes, journaux de recherche, résolutions et comparaisons ne seront jamais modifiés par cette opération.</strong> Une sauvegarde récupérable est prise avant toute application.</p>
    <div class="toolbar" style="margin-top:14px">
      <button class="btn primary" id="confirmArborisSync">Appliquer la mise à jour</button>
      <button class="btn" data-close-modal>Annuler</button>
    </div>`;
  openModal('Aperçu de la mise à jour depuis Arboris',body);
  const confirmBtn=document.querySelector('#confirmArborisSync');
  if(confirmBtn)confirmBtn.onclick=()=>{

    closeModal();
    alert(`Mise à jour appliquée : ${result.created} créée(s), ${result.updated} actualisée(s), ${result.missing} absente(s) signalée(s), ${result.conflicts} conflit(s) signalé(s).`);
  };
}

const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function getDeviceId(){let id=localStorage.getItem(DEVICE_KEY);if(!id){id=`device_${Date.now()}_${Math.random().toString(36).slice(2,9)}`;originalSetItem.call(localStorage,DEVICE_KEY,id)}return id}
function readMeta(){try{return JSON.parse(localStorage.getItem(META_KEY)||'{}')}catch{return{}}}
function writeMeta(patch){const next={...readMeta(),...patch};originalSetItem.call(localStorage,META_KEY,JSON.stringify(next));return next}
function readPayload(){const raw=localStorage.getItem(CFG.storageKey);if(!raw)return null;try{return JSON.parse(raw)}catch{return null}}
function stableString(value){if(value===null||typeof value!=='object')return JSON.stringify(value);if(Array.isArray(value))return'['+value.map(stableString).join(',')+']';return'{'+Object.keys(value).sort().map(k=>JSON.stringify(k)+':'+stableString(value[k])).join(',')+'}'}
async function hashPayload(value){const bytes=new TextEncoder().encode(stableString(value));const digest=await crypto.subtle.digest('SHA-256',bytes);return[...new Uint8Array(digest)].map(b=>b.toString(16).padStart(2,'0')).join('')}
function deriveTimestamp(obj){const candidates=[];const visit=(v,depth=0)=>{if(depth>5||v==null)return;if(Array.isArray(v)){v.slice(0,100).forEach(x=>visit(x,depth+1));return}if(typeof v==='object'){for(const[k,x]of Object.entries(v)){if(/^(updatedAt|modifiedAt|savedAt|createdAt|timestamp)$/i.test(k)&&typeof x==='string'){const t=Date.parse(x);if(Number.isFinite(t))candidates.push(t)}visit(x,depth+1)}}};visit(obj);return candidates.length?new Date(Math.max(...candidates)).toISOString():''}
function toast(message,ms=3400){const el=document.getElementById('toast');if(!el)return;el.textContent=message;el.classList.add('show');clearTimeout(el._timer);el._timer=setTimeout(()=>el.classList.remove('show'),ms)}
function button(){return document.querySelector('.bg-drive-btn')}
function setStatus(state,title){const b=button();if(!b)return;b.dataset.cloudState=state;b.title=title;b.setAttribute('aria-label',title)}
function installButton(){if(button())return;const host=document.querySelector('.header-actions')||document.querySelector('.brand')||document.body;const b=document.createElement('button');b.type='button';b.className='bg-drive-btn header-icon-btn icon-action btn';b.innerHTML='<svg viewBox="0 0 24 24" aria-hidden="true" style="width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round"><path d="M7 18h10a4 4 0 0 0 .7-7.94A6 6 0 0 0 6.2 8.5 4.5 4.5 0 0 0 7 18Z"/><path d="M12 12v7"/><path d="m9 15 3-3 3 3"/></svg>';b.addEventListener('click',connectDrive);host.insertBefore(b,host.lastElementChild||null);setStatus(navigator.onLine?'offline':'offline','Connecter Google Drive')}
function waitForGoogle(){return new Promise(async(resolve,reject)=>{for(let i=0;i<80;i++){if(window.google?.accounts?.oauth2)return resolve();await sleep(100)}reject(new Error('Le service de connexion Google ne s’est pas chargé.'))})}
async function initTokenClient(){if(tokenClient)return;await waitForGoogle();tokenClient=google.accounts.oauth2.initTokenClient({client_id:CFG.clientId,scope:CFG.scope,callback:()=>{}})}
async function requestToken(prompt='consent'){
  await initTokenClient();
  return new Promise((resolve,reject)=>{
    tokenClient.callback=response=>{if(response?.error)return reject(new Error(response.error_description||response.error));accessToken=response.access_token||'';resolve(accessToken)};
    tokenClient.error_callback=err=>reject(new Error(err?.message||'Connexion Google annulée'));
    tokenClient.requestAccessToken({prompt});
  });
}
async function connectDrive(silent=false){
  if(!navigator.onLine){setStatus('offline','Hors connexion');toast('Connexion Internet indisponible.');return}
  try{setStatus('busy','Connexion à Google Drive…');await requestToken(silent?'':'consent');setStatus('busy','Synchronisation avec Google Drive…');await syncNow({reason:'connexion'});if(accessToken)setStatus('ok','Google Drive synchronisé');}
  catch(error){console.error('Google Drive',error);accessToken='';setStatus('error','Reconnecter Google Drive');if(!silent)toast(`Connexion Drive impossible : ${error.message}`)}
}
async function driveFetch(url,options={}){if(!accessToken)throw new Error('Google Drive n’est pas connecté.');const headers=new Headers(options.headers||{});headers.set('Authorization',`Bearer ${accessToken}`);const response=await fetch(url,{...options,headers});if(response.status===401){accessToken='';setStatus('error','Reconnecter Google Drive');throw new Error('Autorisation Google expirée. Reconnecte Drive.')}if(!response.ok){let msg='';try{msg=(await response.json())?.error?.message||''}catch{}throw new Error(msg||`Erreur Drive ${response.status}`)}return response}
function q(value){return value.replace(/\\/g,'\\\\').replace(/'/g,"\\'")}
async function findCloudFile(){const params=new URLSearchParams({q:`name='${q(CFG.fileName)}' and trashed=false`,spaces:'drive',fields:'files(id,name,modifiedTime,createdTime,size)',orderBy:'modifiedTime desc',pageSize:'10'});const res=await driveFetch(`https://www.googleapis.com/drive/v3/files?${params}`);const json=await res.json();cloudFile=json.files?.[0]||null;return cloudFile}
async function readCloud(){const file=await findCloudFile();if(!file)return null;const res=await driveFetch(`https://www.googleapis.com/drive/v3/files/${encodeURIComponent(file.id)}?alt=media`);const text=await res.text();try{return JSON.parse(text)}catch{throw new Error('La sauvegarde Drive est illisible.')}}
async function createCloud(wrapper){const boundary='bg_'+Math.random().toString(36).slice(2);const metadata={name:CFG.fileName,mimeType:'application/json',appProperties:{bureauGenealogique:'1',application:CFG.appId}};const body=`--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(metadata)}\r\n--${boundary}\r\nContent-Type: application/json\r\n\r\n${JSON.stringify(wrapper)}\r\n--${boundary}--`;const res=await driveFetch('https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart&fields=id,name,modifiedTime',{method:'POST',headers:{'Content-Type':`multipart/related; boundary=${boundary}`},body});cloudFile=await res.json();return cloudFile}
async function updateCloud(wrapper){if(!cloudFile)await findCloudFile();if(!cloudFile)return createCloud(wrapper);const res=await driveFetch(`https://www.googleapis.com/upload/drive/v3/files/${encodeURIComponent(cloudFile.id)}?uploadType=media&fields=id,name,modifiedTime`,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(wrapper)});cloudFile=await res.json();return cloudFile}
async function uploadLocal(existingCloud=null){const payload=readPayload();if(!payload)throw new Error(`Aucune donnée ${CFG.appName} à sauvegarder.`);const meta=readMeta();const hash=await hashPayload(payload);const revision=Math.max(Number(existingCloud?.revision)||0,Number(meta.lastCloudRevision)||0)+1;const wrapper={schema:'bureau-genealogique-drive-v1',application:CFG.appId,applicationName:CFG.appName,revision,updatedAt:nowIso(),deviceId:getDeviceId(),payloadHash:hash,payload};await updateCloud(wrapper);writeMeta({dirty:false,lastLocalChange:wrapper.updatedAt,lastCloudRevision:revision,lastCloudHash:hash,lastSyncAt:nowIso()});setStatus('ok',`Synchronisé avec Drive · ${new Date().toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}`);toast(`${CFG.appName} sauvegardé sur Google Drive.`);return wrapper}
async function importCloud(cloud){if(!cloud?.payload)throw new Error('La sauvegarde cloud ne contient aucune donnée.');applyingCloud=true;try{originalSetItem.call(localStorage,CFG.storageKey,JSON.stringify(cloud.payload));writeMeta({dirty:false,lastLocalChange:cloud.updatedAt||nowIso(),lastCloudRevision:Number(cloud.revision)||0,lastCloudHash:cloud.payloadHash||await hashPayload(cloud.payload),lastSyncAt:nowIso()});sessionStorage.setItem(`bg-drive-imported:${CFG.appId}`,'1');sessionStorage.setItem(`bg-drive-reconnect:${CFG.appId}`,'1');toast('Sauvegarde Drive plus récente importée. Actualisation…',1800);setTimeout(()=>location.reload(),900)}finally{applyingCloud=false}}
async function syncNow({reason='manuel'}={}){
  if(syncing||!accessToken||!navigator.onLine)return;
  syncing=true;setStatus('busy','Synchronisation avec Google Drive…');
  try{
    const local=readPayload();if(!local)throw new Error('Aucune donnée locale trouvée.');
    const localHash=await hashPayload(local);const meta=readMeta();const cloud=await readCloud();
    if(!cloud){await uploadLocal(null);return}
    const cloudHash=cloud.payloadHash||await hashPayload(cloud.payload);
    if(localHash===cloudHash){writeMeta({dirty:false,lastCloudRevision:Number(cloud.revision)||0,lastCloudHash:cloudHash,lastSyncAt:nowIso(),lastLocalChange:cloud.updatedAt||meta.lastLocalChange||deriveTimestamp(local)||nowIso()});setStatus('ok','Google Drive synchronisé');return}
    const localChanged=Date.parse(meta.lastLocalChange||deriveTimestamp(local)||0)||0;
    const cloudChanged=Date.parse(cloud.updatedAt||0)||0;
    const cloudAdvanced=Number(cloud.revision||0)>Number(meta.lastCloudRevision||0);
    if(meta.dirty&&cloudAdvanced){setStatus('conflict','Conflit entre cet appareil et Google Drive');const replace=confirm(`Une sauvegarde ${CFG.appName} plus récente existe sur Google Drive, mais cet appareil contient aussi des modifications non envoyées.\n\nOK : utiliser la version Drive.\nAnnuler : ne rien écraser pour le moment.`);if(replace)await importCloud(cloud);else toast('Conflit conservé : aucune version n’a été écrasée.',5000);return}
    if(!meta.dirty&&cloudChanged>=localChanged){await importCloud(cloud);return}
    if(meta.dirty||localChanged>cloudChanged){await uploadLocal(cloud);return}
    await importCloud(cloud);
  }catch(error){console.error('Synchronisation Drive',error);setStatus(navigator.onLine?'error':'offline',navigator.onLine?'Erreur Drive — cliquer pour reconnecter':'Hors connexion');toast(`Synchronisation impossible : ${error.message}`,5000)}finally{syncing=false}
}
function markDirty(){if(applyingCloud)return;writeMeta({dirty:true,lastLocalChange:nowIso()});setStatus(accessToken?'busy':'offline',accessToken?'Modifications en attente d’envoi':'Drive non connecté — modifications conservées localement');clearTimeout(changeTimer);changeTimer=setTimeout(()=>syncNow({reason:'modification'}),5000)}
Storage.prototype.setItem=function(key,value){const result=originalSetItem.apply(this,arguments);if(this===localStorage&&key===CFG.storageKey)markDirty();return result};
window.addEventListener('storage',e=>{if(e.key===CFG.storageKey)markDirty()});
window.addEventListener('online',()=>{setStatus(accessToken?'busy':'offline',accessToken?'Connexion revenue — synchronisation…':'Reconnecter Google Drive');if(accessToken)syncNow({reason:'retour-en-ligne'})});
window.addEventListener('offline',()=>setStatus('offline','Hors connexion — sauvegarde locale active'));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&accessToken)syncNow({reason:'retour-page'})});
setInterval(()=>{if(accessToken)syncNow({reason:'controle-15-minutes'})},CFG.intervalMs);
async function boot(){installButton();const imported=sessionStorage.getItem(`bg-drive-imported:${CFG.appId}`);if(imported){sessionStorage.removeItem(`bg-drive-imported:${CFG.appId}`);toast('La sauvegarde Google Drive la plus récente est chargée.')}const reconnect=sessionStorage.getItem(`bg-drive-reconnect:${CFG.appId}`);if(reconnect){sessionStorage.removeItem(`bg-drive-reconnect:${CFG.appId}`);await sleep(700);connectDrive(true)}}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot);else boot();
window.BureauGenealogiqueDrive={connect:connectDrive,sync:syncNow,status:()=>({connected:!!accessToken,meta:readMeta(),file:cloudFile})};
})();
</script>
