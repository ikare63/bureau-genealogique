<!DOCTYPE html>
<!-- Pistoria — corrections du 16 août 2026 (audit complet : 1 Critique, 1 Important, 4 Moyen) -->
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pistoria — Suivez les pistes, gardez la méthode</title>
<style>
:root{
  --bg:#f5f7f4;--panel:#fff;--text:#161b18;--muted:#667068;--line:#dfe5df;
  --accent:#2f6f4e;--accent-2:#e8f2ec;--danger:#a64040;--warn:#b8771a;
  --header:rgba(255,255,255,.94);--input:#fff;--soft:#f2f6f3;
  --radius:16px;--shadow:0 10px 30px rgba(25,45,32,.08)
}
html[data-theme="dark"]{
  --bg:#111512;--panel:#1a201c;--text:#f1f4f1;--muted:#aeb8b0;--line:#39423b;
  --accent:#66a77d;--accent-2:#24372b;--danger:#ef9292;--warn:#e3b866;
  --header:rgba(20,25,21,.95);--input:#151a17;--soft:#202a23;
  --shadow:0 10px 30px rgba(0,0,0,.28)
}
*{box-sizing:border-box}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);z-index:9999;
  background:var(--panel);color:var(--text);border:1px solid var(--line);
  padding:11px 18px;border-radius:12px;box-shadow:var(--shadow);
  font:600 14px/1.4 system-ui,sans-serif;max-width:min(92vw,560px);text-align:center;
  opacity:0;pointer-events:none;transition:opacity .2s ease}
.toast.show{opacity:1}
html{scroll-behavior:smooth}
body{margin:0;font:15px/1.5 system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{cursor:pointer}
a{color:inherit}
header{
  position:sticky;top:0;z-index:20;background:var(--header);backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line)
}
.topbar{max-width:1200px;margin:auto;padding:14px 18px;display:flex;gap:18px;align-items:center;justify-content:space-between}
.brand{display:flex;align-items:center;gap:12px}
.logo{width:42px;height:42px;border-radius:13px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:23px;box-shadow:var(--shadow)}
.brand h1{font-size:1.1rem;margin:0}
.brand p{margin:1px 0 0;color:var(--muted);font-size:.84rem}
nav{display:flex;gap:7px;overflow:auto;padding:0 18px 12px;max-width:1200px;margin:auto}
nav button{white-space:nowrap;border:1px solid var(--line);background:var(--panel);padding:9px 13px;border-radius:999px;font-weight:750;color:var(--text)}
.sister-nav{display:flex;gap:10px;overflow:auto;max-width:1200px;margin:auto;padding:0 18px 12px}
.sister-link{display:inline-flex;align-items:center;justify-content:center;min-width:130px;padding:10px 18px;border:2px solid var(--text);border-radius:999px;background:var(--panel);color:var(--text);text-decoration:none;font-size:1rem;font-weight:850;white-space:nowrap}
.sister-link.active{background:var(--text);color:var(--panel)}
.theme-btn,.header-icon-btn{
  width:44px;height:44px;padding:0;display:grid;place-items:center;
  border:1px solid var(--line);border-radius:12px;background:var(--panel);color:var(--text)
}
.header-icon-btn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.header-icon-btn:hover,.theme-btn:hover{transform:translateY(-1px);box-shadow:var(--shadow)}
.header-actions{display:flex;gap:8px;align-items:center;margin:0}
html[data-theme="dark"] .logo{background:#315f43}
html[data-theme="dark"] .notice{background:#1f3126;color:#d7eadc;border-color:#355341}
html[data-theme="dark"] .reason-box{background:var(--soft)}
html[data-theme="dark"] .modal,html[data-theme="dark"] .modal-head{background:var(--panel)}
html[data-theme="dark"] details,html[data-theme="dark"] input,html[data-theme="dark"] select,html[data-theme="dark"] textarea,html[data-theme="dark"] .btn{background:var(--input);color:var(--text)}
html[data-theme="dark"] .locked-piste{background:#171c18}

nav button.active{background:var(--accent);border-color:var(--accent);color:#fff}
main{max-width:1200px;margin:auto;padding:22px 18px 60px}
.hero{display:grid;grid-template-columns:1.3fr .7fr;gap:16px;margin-bottom:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:17px;box-shadow:var(--shadow)}
.hero .card:first-child{padding:24px}
.hero h2{font-size:2rem;line-height:1.1;margin:0 0 10px}
.hero p{color:var(--muted);max-width:720px}
.grid{display:grid;gap:14px}
.grid.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.grid.four{grid-template-columns:repeat(4,minmax(0,1fr))}
.stack{display:grid;gap:12px}
.section-head{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;margin:0 0 14px}
.section-head h2{margin:0;font-size:1.35rem}
.section-head p{margin:4px 0 0;color:var(--muted)}
.btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:10px 13px;border-radius:11px;font-weight:760}
.btn:hover{transform:translateY(-1px)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.danger{color:var(--danger);border-color:#efcaca}
.btn.small{padding:7px 10px;font-size:.88rem}
.button-row{display:flex;flex-wrap:wrap;gap:8px;margin-top:12px}
.stat strong{display:block;font-size:1.8rem}
.stat span{color:var(--muted)}
.badge{display:inline-flex;align-items:center;gap:6px;padding:5px 8px;border-radius:999px;background:var(--accent-2);color:var(--accent);font-size:.8rem;font-weight:800}
.badge.warn{background:#fff4dc;color:var(--warn)}
.badge.danger{background:#fde9e9;color:var(--danger)}
.progress{height:10px;background:#edf0ed;border-radius:999px;overflow:hidden;margin-top:10px}
.progress>span{display:block;height:100%;background:var(--accent);border-radius:999px}
.list-item{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.list-item h3{margin:0 0 4px;font-size:1rem}
.list-item p{margin:0;color:var(--muted)}
.meta{display:flex;flex-wrap:wrap;gap:7px;margin-top:9px}
.field{display:grid;gap:6px}
.field label{font-weight:760}
.field small{color:var(--muted)}
input,select,textarea{
  width:100%;border:1px solid var(--line);border-radius:11px;padding:10px 11px;background:var(--input);color:var(--text)
}
textarea{min-height:110px;resize:vertical}
.form-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
details{border:1px solid var(--line);border-radius:13px;background:var(--panel)}
summary{list-style:none;padding:13px 15px;cursor:pointer;font-weight:800}
summary::-webkit-details-marker{display:none}
details[open] summary{border-bottom:1px solid var(--line)}
.details-body{padding:14px}
.empty{text-align:center;padding:35px;color:var(--muted)}
.plan-step{border-left:4px solid var(--accent)}
.plan-step.done{opacity:.65;border-left-color:#98a49c}
.plan-step h3{margin:0 0 6px}
.plan-step p{margin:0;color:var(--muted)}
.plan-step .step-index{font-weight:900;color:var(--accent)}
.kicker{text-transform:uppercase;letter-spacing:.08em;font-size:.74rem;font-weight:900;color:var(--accent)}
.timeline{display:grid;gap:10px}
.timeline-item{position:relative;padding-left:28px}
.timeline-item:before{content:"";position:absolute;left:7px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.timeline-item:after{content:"";position:absolute;left:11px;top:18px;bottom:-15px;width:2px;background:var(--line)}
.timeline-item:last-child:after{display:none}
.compare-table{width:100%;border-collapse:collapse}
.compare-table th,.compare-table td{padding:10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.compare-choice{display:flex;gap:6px;flex-wrap:wrap}
.modal-backdrop{
  position:fixed;
  inset:0;
  z-index:10000;
  background:rgba(0,0,0,.52);
  display:flex;
  align-items:flex-start;
  justify-content:center;
  overflow:auto;
  padding:8px;
  padding-top:max(8px,env(safe-area-inset-top));
  box-sizing:border-box;
  overscroll-behavior:contain;
}
.modal{
  position:relative;
  flex:0 0 auto;
  width:min(850px,100%);
  max-height:calc(100svh - 16px);
  margin:0 auto;
  background:var(--panel);
  border-radius:18px;
  overflow:hidden;
  box-shadow:0 30px 80px rgba(0,0,0,.28);
  display:flex;
  flex-direction:column;
}
.modal-head{
  position:relative;
  flex:0 0 auto;
  background:var(--panel);
  border-bottom:1px solid var(--line);
  padding:14px 16px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  z-index:3;
}
.modal-head h2{
  margin:0;
  font-size:1.2rem;
  line-height:1.25;
  overflow-wrap:anywhere;
}
.modal-body{
  flex:1 1 auto;
  min-height:0;
  padding:16px;
  overflow-y:auto;
  overscroll-behavior:contain;
  -webkit-overflow-scrolling:touch;
}
body.modal-open{overflow:hidden}
@media(max-width:600px){
  .modal-backdrop{
    padding:4px;
    padding-top:max(4px,env(safe-area-inset-top));
  }
  .modal{
    width:100%;
    max-height:calc(100svh - 8px);
    border-radius:14px;
  }
  .modal-head{padding:12px}
  .modal-body{padding:12px}
}
.icon-btn{border:0;background:transparent;font-size:1.45rem}
.hidden{display:none!important}
.notice{padding:12px 14px;border-radius:12px;background:#f1f6f3;color:#315a45;border:1px solid #d6e8dc}
@media(max-width:850px){
  .hero,.grid.two,.grid.three,.grid.four,.form-grid{grid-template-columns:1fr}
  .topbar{align-items:flex-start}
  .brand p{display:none}
  .hero h2{font-size:1.6rem}
}

.investigation-groups{display:grid;gap:24px}
.group-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:10px}
.group-title h3{margin:0;font-size:1.18rem}
.current-piste{border:2px solid var(--accent);background:#fbfefc}
.locked-piste{opacity:.52;background:#f4f5f4}
.result-piste{border-left:5px solid var(--line)}
.result-piste.negative{border-left-color:var(--warn)}
.result-piste.found{border-left-color:var(--accent)}
.result-piste.partial{border-left-color:#5d7399}
.piste-number{font-size:.76rem;font-weight:900;text-transform:uppercase;letter-spacing:.06em;color:var(--accent)}
.reason-box{background:#f2f6f3;border-radius:11px;padding:10px 12px;margin-top:10px}
.status-line{font-size:.85rem;color:var(--muted);margin-top:6px}


/* ===== En-tête unifié Arboris · Scriptoria · Pistoria ===== */
.suite-header{
  position:sticky;top:0;z-index:100;
  width:100%;background:var(--header,rgba(255,255,255,.96));
  backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);
  border-bottom:1px solid var(--line,#d8ddd9);
}
.suite-header .topbar,
.suite-header .sister-nav,
.suite-header .suite-tabs{
  width:min(1200px,100%);margin:0 auto;padding-left:18px;padding-right:18px;
}
.suite-header .topbar{
  min-height:74px;padding-top:12px;padding-bottom:12px;
  display:flex;align-items:center;justify-content:space-between;gap:16px;
}
.suite-header .brand{display:flex;align-items:center;gap:12px;min-width:0}
.suite-header .logo{
  width:52px;height:52px;flex:0 0 52px;border-radius:15px;
  display:grid;place-items:center;overflow:hidden;
  background:var(--accent,#2f6f4e);box-shadow:0 8px 20px rgba(25,45,32,.12);
  font-size:27px;color:#fff;
}
.suite-header .logo svg{width:100%;height:100%;display:block}
.suite-header .brand-copy{min-width:0}
.suite-header .brand h1{margin:0;font-size:1.32rem;line-height:1.1;white-space:nowrap}
.suite-header .brand p{margin:3px 0 0;color:var(--muted,#667068);font-size:.82rem;white-space:nowrap}
.suite-header .header-actions{display:flex;align-items:center;gap:8px;margin:0;flex:0 0 auto}
.suite-header .header-icon-btn,
.suite-header .theme-btn{
  width:44px;height:44px;min-width:44px;padding:0;margin:0;
  display:grid;place-items:center;border:1.5px solid var(--text,#161b18);
  border-radius:13px;background:var(--panel,#fff);color:var(--text,#161b18);
  box-shadow:none;
}
.suite-header .header-icon-btn svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.suite-header .theme-btn{font-size:1.4rem}
.suite-header .sister-nav{
  display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;
  padding-top:0;padding-bottom:12px;overflow:visible;
}
.suite-header .sister-link{
  min-width:0;padding:9px 12px;border:2px solid var(--text,#161b18);
  border-radius:999px;background:var(--panel,#fff);color:var(--text,#161b18);
  text-decoration:none;text-align:center;font-size:1rem;font-weight:850;white-space:nowrap;
}
.suite-header .sister-link.active{background:var(--text,#161b18);color:var(--panel,#fff)}
.suite-header .suite-tabs{
  display:flex;gap:8px;padding-top:0;padding-bottom:12px;overflow-x:auto;
  scrollbar-width:thin;overscroll-behavior-inline:contain;
}
.suite-header .suite-tabs button{
  flex:0 0 auto;white-space:nowrap;border:1px solid var(--line,#d8ddd9);
  border-radius:999px;padding:9px 13px;background:var(--panel,#fff);
  color:var(--text,#161b18);font-weight:780;
}
.suite-header .suite-tabs button.active{background:var(--accent,#2f6f4e);border-color:var(--accent,#2f6f4e);color:#fff}
@keyframes export-alert-pulse{
  0%,100%{background:var(--panel,#fff);color:#b42318;border-color:#d92d20;box-shadow:0 0 0 0 rgba(217,45,32,.35)}
  50%{background:#d92d20;color:#fff;border-color:#d92d20;box-shadow:0 0 0 7px rgba(217,45,32,0)}
}
.suite-header .export-alert{animation:export-alert-pulse 1.05s ease-in-out infinite}
@media (prefers-reduced-motion:reduce){.suite-header .export-alert{animation:none;background:#d92d20;color:#fff;border-color:#d92d20}}
@media(max-width:650px){
  .suite-header .topbar{min-height:72px;padding:10px 14px;gap:10px}
  .suite-header .sister-nav,.suite-header .suite-tabs{padding-left:14px;padding-right:14px}
  .suite-header .logo{width:48px;height:48px;flex-basis:48px;border-radius:14px}
  .suite-header .brand h1{font-size:1.18rem}
  .suite-header .brand p{display:none}
  .suite-header .header-actions{gap:6px}
  .suite-header .header-icon-btn,.suite-header .theme-btn{width:40px;height:40px;min-width:40px;border-radius:12px}
  .suite-header .sister-nav{gap:8px;padding-bottom:10px}
  .suite-header .sister-link{padding:8px 8px;font-size:.94rem}
  .suite-header .suite-tabs{padding-bottom:10px}
  .suite-header .suite-tabs button{padding:8px 12px}
}
@media(max-width:390px){
  .suite-header .topbar{padding-left:10px;padding-right:10px}
  .suite-header .sister-nav,.suite-header .suite-tabs{padding-left:10px;padding-right:10px}
  .suite-header .logo{width:44px;height:44px;flex-basis:44px}
  .suite-header .brand h1{font-size:1.08rem}
  .suite-header .header-icon-btn,.suite-header .theme-btn{width:38px;height:38px;min-width:38px}
  .suite-header .sister-link{font-size:.88rem;padding:7px 5px}
}



/* ===== Correctif final : en-tête strictement identique dans les 3 applications ===== */

const BACKUP_KEY='pistoria_private_v3_backup';
const uid=(prefix='id')=>`${prefix}_${Date.now()}_${Math.random().toString(36).slice(2,7)}`;
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const today=()=>new Date().toISOString().slice(0,10);
const cloneData=value=>{
  if(value===undefined)return undefined;
  return JSON.parse(JSON.stringify(value));
};
function storageGet(key){
  try{return localStorage.getItem(key)}catch(error){
    console.warn('localStorage lecture indisponible',error);
    return null;
  }
}
function storageSet(key,value){
  try{
    localStorage.setItem(key,value);
    return {ok:true};
  }catch(error){
    console.warn('localStorage écriture indisponible',error);
    return {ok:false,error};
  }
}
function storageRemove(key){
  try{localStorage.removeItem(key);return true}catch(error){
    console.warn('localStorage suppression indisponible',error);
    return false;
  }
}
function isStorageAccessError(error){
  return !!error&&(
    error.name==='SecurityError'||
    error.name==='NotSupportedError'||
    /access|origin|storage|denied|opaque/i.test(String(error.message||''))
  );
}

const fmtDate=v=>{
  if(!v)return'—';
  const m=String(v).match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(m)return`${m[3]}/${m[2]}/${m[1]}`;
  const d=new Date(v);
  return Number.isNaN(d.getTime())?String(v):new Intl.DateTimeFormat('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric'}).format(d)
};

const defaultData={"version":"5.0.0","schema":"pistoria-private-v5","privacy":{"containsPrivateGenealogyData":false,"intendedForLocalImportOnly":true,"embeddedInHtml":false},"scope":{"mode":"sosa-only","label":"Ancêtres directs uniquement","investigateDirectAncestorsOnly":true,"investigateCollateralRelatives":false,"investigateNonSosaSpouses":false,"relativesMayBeUsedAsEvidenceSources":true,"note":"Les actes des enfants, conjoints ou collatéraux peuvent servir de preuves, mais aucune enquête autonome n'est créée pour eux."},"source":{"application":"Arboris","file":""},"investigations":[],"audit":{},"comparisons":[],"repositories":[],"settings":{"theme":"light","dateDisplay":"dd/mm/yyyy","maxWorkingAge":100},"evidenceMemory":{"people":{},"families":[]},"genealogy":{"people":[],"families":[],"sources":[],"places":[],"relations":[]},"proofGraph":{"claims":[],"sources":[],"links":[]},"anomalies":[],"researchQueue":[],"communeHistory":[],"ruleEngine":{"version":"2.0.0","recalculateOn":["import","journal-save","result-save","coverage-save","census-import"],"principles":["Journal structuré transformé en faits","Plan recalculé selon les preuves et les échecs","Recensements Arboris utilisés comme bornes et domiciles","Contradictions conservées jusqu'à résolution","Pistes classées par rendement informationnel","Sources conditionnées par période, sexe, lieu et disponibilité","Enquête limitée aux Sosa, collatéraux utilisés seulement comme indices"]}};


const OFFICIAL_LOCAL_REPOSITORIES=[

function ensureOfficialRepositories(){
  data.repositories=data.repositories||[];
  for(const repo of OFFICIAL_LOCAL_REPOSITORIES){

      Object.assign(existing,repo);
    }else{

    }

}

function isCompletedResearchStep(step){
  return ['done','found','partial','negative','skipped'].includes(step?.status);
}
function isDecennialTableStep(step){
  const text=`${step?.type||''} ${step?.title||''} ${step?.sourceCategory||''}`.toLowerCase();
  return /table décennale|table decennale/.test(text);
}
function buildGeneanetStep(inv,referenceStep){
  const target=referenceStep?.targetSection||'la fiche';
  const fields=Array.isArray(referenceStep?.targetFields)?referenceStep.targetFields:[];
  const name=inv.person||'la personne';
  const place=referenceStep?.place||'';
  const period=referenceStep?.period||'';

  return {
    id:`${inv.id}_geneanet_initial`,
    order:1,
    title:`Rechercher d’abord des indices sur Geneanet pour ${name}`,
    type:'Recherche collaborative — indices préliminaires',
    place,
    period,
    status:'todo',
    quick:true,
    estimatedMinutes:5,
    reason:'Une recherche rapide sur Geneanet peut fournir une commune, une période, un conjoint, des parents, un relevé ou une référence de registre. Ces éléments servent uniquement à orienter la recherche avant de consulter les tables décennales et les actes originaux.',
    instructions:`Recherche ${name}${place?` avec la commune ${place}`:''}${period?` et la période ${period}`:''}. Teste les variantes du nom et des prénoms, puis ajoute le conjoint ou les parents si nécessaire. Relève uniquement les indices utiles et la source citée. Toute information doit ensuite être vérifiée dans le registre ou le document original.`,
    targetSection:target,
    targetFields:fields,
    archiveDepartment:'',
    archiveName:'Geneanet',
    archiveUrl:'https://www.geneanet.org/',
    sourceCategory:'Geneanet',
    verificationRequired:true
  };
}

function normalizeRepositoryLabelsAndLinks(){
  for(const repo of data.repositories||[]){
    repo.name=shortRepositoryName(repo.name);
  }
  for(const inv of data.investigations||[]){
    for(const step of inv.steps||[]){
      const text=`${step.sourceCategory||''} ${step.archiveName||''} ${step.type||''} ${step.title||''}`.toLowerCase();
      if(text.includes('geneanet')){
        step.archiveName='Geneanet';
        step.archiveUrl='https://www.geneanet.org/';
        step.sourceCategory='Geneanet';
      }else{
        step.archiveName=shortRepositoryName(step.archiveName);
      }
    }
  }
}

function ensureGeneanetPistes(){
  for(const inv of data.investigations||[]){
    inv.steps=Array.isArray(inv.steps)?inv.steps:[];

    // Une enquête close ou sans action restante ne doit pas être réorganisée.
    if(inv.status==='closed'||!inv.steps.length)continue;
    const hasOpenStep=inv.steps.some(step=>!isCompletedResearchStep(step));
    if(!hasOpenStep)continue;

    let geneanet=inv.steps.find(step=>
      step?.sourceCategory==='Geneanet'||
      String(step?.id||'').includes('_geneanet_')
    );

    const firstUseful=inv.steps.find(step=>!isCompletedResearchStep(step))||inv.steps[0];
    if(!geneanet){
      geneanet=buildGeneanetStep(inv,firstUseful);
      inv.steps.push(geneanet);
    }else{
      geneanet.title=`Rechercher d’abord des indices sur Geneanet pour ${inv.person||'la personne'}`;
      geneanet.order=1;
      geneanet.quick=true;
      geneanet.estimatedMinutes=geneanet.estimatedMinutes||5;
      geneanet.archiveName='Geneanet';
      geneanet.archiveUrl='https://www.geneanet.org/';
      geneanet.sourceCategory='Geneanet';
      geneanet.verificationRequired=true;
    }

    const completed=inv.steps
      .filter(step=>step!==geneanet&&isCompletedResearchStep(step))
      .sort((a,b)=>(a.order||9999)-(b.order||9999));

    const open=inv.steps
      .filter(step=>step!==geneanet&&!isCompletedResearchStep(step));

    // Après Geneanet, la première table décennale devient la deuxième étape.
    const tables=open.filter(isDecennialTableStep);
    const otherSteps=open.filter(step=>!isDecennialTableStep(step));
    const orderedOpen=[
      geneanet,
      ...(tables.length?[tables[0]]:[]),
      ...otherSteps,
      ...tables.slice(1)
    ];

    // Les résultats déjà obtenus sont conservés dans le plan et ne sont jamais
    // remis à l'état verrouillé.
    inv.steps=[...completed,...orderedOpen];
    inv.steps.forEach((step,index)=>{step.order=index+1});

    const firstPending=inv.steps.find(step=>!isCompletedResearchStep(step));
    for(const step of inv.steps){
      if(isCompletedResearchStep(step))continue;
      step.status=step===firstPending?'todo':'locked';
    }
  }
}
function applyRepositoryEnhancements(){
  ensureOfficialRepositories();
  ensureGeneanetPistes();

}

function trackNewResolvedInvestigations(){const current=pistoriaResolvedIds();let previous=[];try{previous=JSON.parse(storageGet(PISTORIA_RESOLVED_SNAPSHOT_KEY)||'null')}catch(e){}if(!Array.isArray(previous)){storageSet(PISTORIA_RESOLVED_SNAPSHOT_KEY,JSON.stringify(current));updatePistoriaExportAlert();return}const old=new Set(previous),added=current.filter(id=>!old.has(id)).length;if(added)storageSet(PISTORIA_EXPORT_COUNT_KEY,String(pistoriaExportCount()+added));storageSet(PISTORIA_RESOLVED_SNAPSHOT_KEY,JSON.stringify(current));updatePistoriaExportAlert()}

function preferredTheme(){
  const saved=storageGet('pistoria_theme');
  if(saved==='dark'||saved==='light')return saved;
  return window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'

function loadData(){
  try{

    return raw?JSON.parse(raw):cloneData(defaultData);
  }catch(e){
    console.warn('Chargement Pistoria impossible',e);
    return cloneData(defaultData);
  }
}
function compactForLocalStorage(source){
  const compact=cloneData(source);

  // Pistoria fonctionne à partir des enquêtes. Le sous-arbre généalogique,
  // le graphe complet de preuves et les données de migration restent dans
  // le JSON privé d'origine, mais ne sont pas recopiés dans localStorage.
  delete compact.genealogy;
  delete compact.proofGraph;
  delete compact.migration;

  // Les files et anomalies sont recalculables ou déjà visibles dans les enquêtes.
  if(Array.isArray(compact.researchQueue)){
    compact.researchQueue=compact.researchQueue.map(item=>({
      investigationId:item.investigationId,
      personId:item.personId,
      stepId:item.stepId,
      title:item.title,
      estimatedMinutes:item.estimatedMinutes,
      priorityScore:item.priorityScore
    }));
  }

  if(Array.isArray(compact.anomalies)){
    compact.anomalies=compact.anomalies.map(item=>({
      id:item.id,
      kind:item.kind,
      severity:item.severity,
      entityId:item.entityId,
      title:item.title,
      details:item.details,
      status:item.status
    }));
  }

  // Supprimer les doublons lourds dans chaque enquête.
  for(const inv of compact.investigations||[]){
    delete inv.arborisSnapshot;
    delete inv.familyContext;
    delete inv.rememberedEvidence;

    // Les pistes automatiques encore ouvertes sont entièrement recalculables
    // depuis le journal. Elles ne doivent pas gonfler localStorage.
    inv.steps=(inv.steps||[]).filter(step=>
      !step.ruleGenerated || isCompletedResearchStep(step)
    );

    // Les indices structurés sont également recalculés depuis known + logs.
    delete inv.structuredClues;
    delete inv.ruleEngine;
  }

  return compact;
}
function persistCurrentData(){
  const compact=compactForLocalStorage(data);
  const payload=JSON.stringify(compact);

  /*
    setItem() remplace la valeur de manière atomique. En cas de quota dépassé,
    l’ancienne sauvegarde doit rester intacte : on ne supprime donc jamais
    STORAGE_KEY avant d’avoir réussi la nouvelle écriture.
  */
  const result=storageSet(STORAGE_KEY,payload);

  if(result.ok){
    [
      'pistoria_data_v2_consolide',
      'pistoria_data_v2',
      'pistoria_data'
    ].forEach(key=>{
      if(key!==STORAGE_KEY)storageRemove(key);
    });

    data=compact;
    return {
      ok:true,
      persisted:true,
      bytes:new Blob([payload]).size
    };
  }

  console.error(
    'Sauvegarde locale Pistoria refusée. La sauvegarde précédente est conservée.',
    result.error
  );

  return {
    ok:false,
    persisted:false,
    error:result.error,
    reason:isStorageAccessError(result.error)?'storage-unavailable':'storage-failed'
  };
}
function saveData(){
  recalculateAllPlans(data);
  const result=persistCurrentData();

  if(!result.persisted){
    alert(
      'Pistoria n’a pas pu enregistrer les modifications dans le navigateur. '+
      'La sauvegarde locale précédente a été conservée. Exporte ton JSON avant de fermer la page.'

  trackNewResolvedInvestigations();
  render();
  return result;
}

function cleanSummaryValue(value){
  return String(value||'').replace(/\s+/g,' ').trim();
}
function pushUniqueSummaryLine(lines,line){
  const clean=cleanSummaryValue(line);
  if(!clean)return;
  const fingerprint=clean
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .toLowerCase()
    .replace(/[.,;:]/g,'');
  if(!lines.some(item=>item.fingerprint===fingerprint)){
    lines.push({text:clean,fingerprint});
  }
}
function isoDateFromFrench(value){
  const match=String(value||'').match(/\b(\d{2})\/(\d{2})\/(\d{4})\b/);
  return match?`${match[3]}-${match[2]}-${match[1]}`:'';
}
function formatIsoFrench(value){
  if(!value)return'';
  return fmtDate(value);
}
function shiftIsoYears(value,years){
  const match=String(value||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!match)return'';
  const date=new Date(Date.UTC(Number(match[1]),Number(match[2])-1,Number(match[3])));
  date.setUTCFullYear(date.getUTCFullYear()+years);
  return date.toISOString().slice(0,10);
}
function addIsoDays(value,days){
  const match=String(value||'').match(/^(\d{4})-(\d{2})-(\d{2})$/);
  if(!match)return'';
  const date=new Date(Date.UTC(Number(match[1]),Number(match[2])-1,Number(match[3])));
  date.setUTCDate(date.getUTCDate()+days);
  return date.toISOString().slice(0,10);
}
function probableBirthRangeFromDeath(deathDate,age){
  const years=Number(age);
  if(!deathDate||!Number.isFinite(years))return null;
  const upper=shiftIsoYears(deathDate,-years);
  const lower=addIsoDays(shiftIsoYears(deathDate,-years-1),1);
  return lower&&upper?{lower,upper}:null;
}
function sourceCategoryFromLog(log){
  const explicit=String(log?.sourceFormCategory||'').toLowerCase();
  if(explicit)return explicit;
  const text=`${log?.source||''} ${log?.stepTitle||''}`.toLowerCase();
  if(/mariage d[’']un enfant|mariage de l[’']enfant/.test(text))return'child-marriage';
  if(/naissance d[’']un enfant|naissance de l[’']enfant/.test(text))return'child-birth';
  if(/décès d[’']un enfant|deces d[’']un enfant/.test(text))return'child-death';
  if(/acte de décès|acte de deces|sépulture|sepulture/.test(text))return'death';
  if(/acte de mariage|contrat de mariage/.test(text))return'marriage';
  if(/acte de naissance|baptême|bapteme/.test(text))return'birth';
  if(/recensement/.test(text))return'census';
  return'generic';
}
function extractAgeFromLog(log,category,inv){
  const details=log?.sourceDetails||{};
  if(category==='death'){
    const explicit=Number(details.ageAtDeath||log.ageAtDeath);
    if(Number.isFinite(explicit)&&explicit>0)return explicit;
  }
  if(category==='marriage'){
    const isFemale=Number(inv?.sosa)%2===1;
    const explicit=Number(
      isFemale
        ?(log.wifeAgeInAct||details.wifeAgeInAct)
        :(log.husbandAgeInAct||details.husbandAgeInAct)
    );
    if(Number.isFinite(explicit)&&explicit>0)return explicit;
  }
  const text=`${log?.notes||''} ${JSON.stringify(details)}`;
  const match=text.match(/âg(?:é|ée)\s+de\s+(\d{1,3})\s+ans/i);
  return match?Number(match[1]):null;
}
function findPlaceMention(text,place){
  return new RegExp(`\\b${String(place).replace(/[.*+?^${}()|[\]\\]/g,'\\$&')}\\b`,'i').test(String(text||''));
}
function arborisDiscoveryItems(inv){
  const targetName=cleanSummaryValue(inv.person||inv.title||'la personne recherchée');
  const items=[];
  const seen=new Set();

  const add=(text,kind='fact')=>{
    const clean=cleanSummaryValue(text);
    if(!clean)return;
    const fingerprint=clean
      .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
      .toLowerCase().replace(/[.,;:]/g,'');
    if(seen.has(fingerprint))return;
    seen.add(fingerprint);
    items.push({text:clean,kind});
  };

  // Les entrées sont ajoutées avec unshift dans le journal :
  // on les inverse pour restituer l'ordre réel de découverte.
  const logs=[...(inv.logs||[])].reverse();

  for(const log of logs){
    if(!['found','partial','positive'].includes(log.result))continue;

    const details=log.sourceDetails||{};
    const category=sourceCategoryFromLog(log);
    const sourceText=`${log.source||''} ${log.stepTitle||''} ${log.notes||''}`;
    const age=extractAgeFromLog(log,category,inv);

    if(category==='death'){
      const date=details.deathDate||log.foundDate||isoDateFromFrench(sourceText);
      const place=details.deathPlace||log.foundPlace||
        ((sourceText.match(/\bà\s+([A-ZÀ-ÖØ-Ý][^,.;\n]+)/)||[])[1]||'');
      let line=`Décès de ${targetName}`;
      if(date)line+=` le ${formatIsoFrench(date)}`;
      if(place)line+=` à ${place}`;
      if(age)line+=` à l’âge de ${age} ans`;

      const range=probableBirthRangeFromDeath(date,age);
      if(range){
        line+=` → naissance probable entre le ${formatIsoFrench(range.lower)} et le ${formatIsoFrench(range.upper)}`;
      }
      add(line,'discovery');
      continue;
    }

    if(category==='child-marriage'){
      const child=details.childName||
        ((sourceText.match(/mariage (?:de|d[’'])\s*([^,.;\n]+)/i)||[])[1]||'un enfant');
      const date=details.childEventDate||log.foundDate||isoDateFromFrench(sourceText);
      const place=details.childEventPlace||log.foundPlace||'';
      add(
        `Mariage de l’enfant ${child}${date?` le ${formatIsoFrench(date)}`:''}${place?` à ${place}`:''}`,
        'relative'
      );
      continue;
    }

    if(category==='child-birth'){
      const child=details.childName||'un enfant';
      const date=details.childEventDate||log.foundDate||'';
      const place=details.childEventPlace||log.foundPlace||'';
      add(
        `Naissance de l’enfant ${child}${date?` le ${formatIsoFrench(date)}`:''}${place?` à ${place}`:''}`,
        'relative'
      );
      continue;
    }

    if(category==='child-death'){
      const child=details.childName||'un enfant';
      const date=details.childEventDate||log.foundDate||'';
      const place=details.childEventPlace||log.foundPlace||'';
      add(
        `Décès de l’enfant ${child}${date?` le ${formatIsoFrench(date)}`:''}${place?` à ${place}`:''}`,
        'relative'
      );
      continue;
    }

    if(category==='marriage'){
      const date=details.marriageDate||log.foundDate||isoDateFromFrench(sourceText);
      const place=details.marriagePlace||log.foundPlace||'';
      let line=`Mariage de ${targetName}`;
      if(date)line+=` le ${formatIsoFrench(date)}`;
      if(place)line+=` à ${place}`;
      if(age)line+=`. Âge : ${age} ans`;

      const context=[
        details.wifeContext,
        details.husbandContext,
        details.marriageAttachments,
        log.notes
      ].filter(Boolean).join(' ');
      const historicalPlace=(data.communeHistory||[]).find(entry=>
        findPlaceMention(context,entry.oldName)
      );
      if(historicalPlace){
        line+=` — mention de ${historicalPlace.oldName}`;
      }else if(/\bMontaud\b/i.test(context)){
        line+=' — mention de Montaud';
      }

      add(line,'discovery');
      continue;
    }

    if(category==='birth'){
      const date=details.birthDate||log.foundDate||isoDateFromFrench(sourceText);
      const place=details.birthPlace||log.foundPlace||'';
      let line=`Acte de naissance de ${targetName} trouvé`;
      if(date)line+=` le ${formatIsoFrench(date)}`;
      if(place)line+=` à ${place}`;

      const history=(data.communeHistory||[]).find(entry=>
        findPlaceMention(place,entry.oldName)||findPlaceMention(place,(entry.aliases||[])[0]||'')
      );
      if(history){
        line+=`, ancienne commune ${history.currentName==='Saint-Étienne'?'ligérienne':''}`.trim();
        line=line.replace(/ancienne commune\s*$/,'ancienne commune');
      }
      add(line,'discovery');
      continue;
    }

    if(category==='census'){
      const year=details.censusYear||'année non précisée';
      const address=details.address||'';
      const people=[details.spouse,details.household]
        .filter(Boolean).join(', ').replace(/\n+/g,', ');
      add(
        `Présence de ${targetName} au recensement de ${year}${address?` à ${address}`:''}${people?` avec ${people}`:''}`,
        'context'
      );
    }
  }

  // Secours : ajouter le fait exact final s'il n'existe pas encore.
  const knownLines=String(inv.known||'').split('\n').map(x=>x.trim()).filter(Boolean);
  const marriageDates=new Set(
    (inv.logs||[])
      .filter(log=>sourceCategoryFromLog(log)==='marriage')
      .map(log=>log.sourceDetails?.marriageDate||log.foundDate)
      .filter(Boolean)
  );

  for(const line of knownLines){
    if(/date inconnue|lieu inconnu|commune inconnue|à préciser|non renseign|^à compléter|^fiche complétée/i.test(line))continue;

    if(/^naissance\s*:/i.test(line)){
      const raw=line.replace(/^naissance\s*:\s*/i,'');
      const iso=isoDateFromFrench(raw);
      if(iso&&marriageDates.has(iso))continue; // empêche le mariage de 1859 d'être présenté comme naissance
      if(!items.some(item=>/^Acte de naissance|^Naissance de/.test(item.text))){
        add(`Naissance de ${targetName} : ${raw}`,'fact');
      }
    }else if(/^mariage\s*:/i.test(line)&&!items.some(item=>item.text.startsWith(`Mariage de ${targetName}`))){
      add(`Mariage de ${targetName} : ${line.replace(/^mariage\s*:\s*/i,'')}`,'fact');
    }else if(/^décès\s*:/i.test(line)&&!items.some(item=>item.text.startsWith(`Décès de ${targetName}`))){
      add(`Décès de ${targetName} : ${line.replace(/^décès\s*:\s*/i,'')}`,'fact');
    }
  }

  return items;
}
function arborisSummarySections(inv){
  const items=arborisDiscoveryItems(inv);
  const sources=[];
  for(const log of inv.logs||[]){
    if(!(log.link||log.reference||log.pageNumber))continue;
    const ref=[
      log.source||log.stepTitle||'Source',
      log.reference?`cote ${log.reference}`:'',
      log.pageNumber?`vue ${log.pageNumber}`:''
    ].filter(Boolean).join(' · ');
    pushUniqueSummaryLine(sources,ref);
  }
  return {
    discoveries:items.map(item=>item.text),
    sources:sources.map(item=>item.text)
  };
}


function arborisSummaryText(inv){
  const sections=arborisSummarySections(inv);
  const blocks=[inv.person||inv.title||'Personne'];
  if(sections.discoveries.length){
    blocks.push(`Résumé des découvertes :\n- ${sections.discoveries.join('\n- ')}`);
  }else{
    blocks.push('Aucun fait suffisamment précis n’a encore été retenu pour Arboris.');
  }
  if(sections.sources.length){
    blocks.push(`Références conservées dans Pistoria :\n- ${sections.sources.join('\n- ')}`);
  }
  return blocks.join('\n\n');
}

async function copyArborisSummary(invId){
  const inv=getInvestigation(invId);
  if(!inv)return;
  const text=arborisSummaryText(inv);
  try{
    await navigator.clipboard.writeText(text);
    alert('Résumé pour Arboris copié.');
  }catch(error){
    const area=document.createElement('textarea');
    area.value=text;
    area.style.position='fixed';
    area.style.left='-9999px';
    document.body.appendChild(area);
    area.select();
    const copied=document.execCommand('copy');
    area.remove();
    alert(copied?'Résumé pour Arboris copié.':'Copie automatique impossible.');
  }
}

function isResolvedInvestigation(inv){
  if(inv.status==='closed')return true;
  if(Array.isArray(inv.missingSummary)&&inv.missingSummary.length===0)return true;

  const target=targetEventFromMissing(inv);
  if(target&&bestJournalProof(inv,target))return true;

  const steps=inv.steps||[];
  return steps.length>0&&!steps.some(s=>['todo','locked'].includes(s.status));
}
function resolutionDate(inv){
  const logs=(inv.logs||[]).filter(l=>l.date||l.consultedAt||l.createdAt);
  const latest=logs.sort((a,b)=>String(b.date||b.consultedAt||b.createdAt).localeCompare(String(a.date||a.consultedAt||a.createdAt)))[0];
  return latest?.date||latest?.consultedAt||latest?.createdAt||'';
}
function resolvedFields(inv){
  const lines=String(inv.known||'').split('\n').filter(Boolean);
  return lines.filter(line=>/^(Naissance|Décès|Mariage)\s*:/i.test(line));

function humanMissingLabel(inv){
  const items=Array.isArray(inv?.missingSummary)?inv.missingSummary:[];
  const labels=[];

  const has=(pattern)=>items.some(item=>pattern.test(String(item||'').toLowerCase()));

  const birthDate=has(/naissance.*date|date.*naissance/);
  const birthPlace=has(/naissance.*commune|naissance.*lieu|commune.*naissance|lieu.*naissance/);
  const deathDate=has(/décès.*date|deces.*date|date.*décès|date.*deces/);
  const deathPlace=has(/décès.*commune|deces.*commune|décès.*lieu|deces.*lieu|commune.*décès|commune.*deces|lieu.*décès|lieu.*deces/);
  const marriageDate=has(/mariage.*date|date.*mariage/);
  const marriagePlace=has(/mariage.*commune|mariage.*lieu|commune.*mariage|lieu.*mariage/);

  if(birthDate&&birthPlace)labels.push('date et commune de naissance');
  else{
    if(birthDate)labels.push('date de naissance');
    if(birthPlace)labels.push('commune de naissance');
  }

  if(marriageDate&&marriagePlace)labels.push('date et commune du mariage');
  else{
    if(marriageDate)labels.push('date du mariage');
    if(marriagePlace)labels.push('commune du mariage');
  }

  if(deathDate&&deathPlace)labels.push('date et commune du décès');
  else{
    if(deathDate)labels.push('date du décès');
    if(deathPlace)labels.push('commune du décès');
  }

  if(!labels.length){
    for(const item of items){
      const cleaned=String(item||'')
        .replace(/^[^:]+:\s*/,'')
        .replace(/\s+/g,' ')
        .trim();
      if(cleaned&&!labels.includes(cleaned))labels.push(cleaned);
    }
  }

  if(!labels.length)return'';

  if(labels.length===1)return labels[0].charAt(0).toUpperCase()+labels[0].slice(1);
  if(labels.length===2){
    const joined=`${labels[0]} et ${labels[1]}`;
    return joined.charAt(0).toUpperCase()+joined.slice(1);
  }

  const joined=`${labels.slice(0,-1).join(', ')} et ${labels.at(-1)}`;
  return joined.charAt(0).toUpperCase()+joined.slice(1);
}
function missingSummaryHtml(inv){
  const label=humanMissingLabel(inv);
  if(!label)return'';
  return `<p style="margin:6px 0 12px;color:var(--text);font-weight:800"><span style="color:var(--muted);font-weight:700">À rechercher :</span> ${esc(label)}</p>`;
}


function shortRepositoryName(name){
  const value=String(name||'').trim();
  const normalized=value
    .replace(/^Archives municipales et métropolitaines de Saint-Étienne$/i,'Archives de Saint-Étienne')
    .replace(/^Archives départementales de la Loire$/i,'Archives de la Loire')
    .replace(/^Archives municipales de Lyon$/i,'Archives de Lyon')
    .replace(/^Archives municipales de Clermont-Ferrand$/i,'Archives de Clermont-Ferrand');
  return normalized;
}
function sourceActionForStep(step){
  const text=`${step?.sourceCategory||''} ${step?.archiveName||''} ${step?.type||''} ${step?.title||''}`.toLowerCase();
  if(text.includes('geneanet')){
    return {name:'Geneanet',url:'https://www.geneanet.org/'};
  }
  const repository=typeof bestRepositoryForStep==='function'?bestRepositoryForStep(step):null;
  return {
    name:shortRepositoryName(step?.archiveName||repository?.name||''),
    url:step?.archiveUrl||repository?.url||''
  };
}

const ARIANE_PATH='../aide_archive/Ariane.html';
function pistoriaArianeSourceKey(inv,step){return `${inv?.id||''}::${step?.id||''}`}
function pistoriaArianeTransfer(inv,step){

function pistoriaArianePayload(inv,step){

  return {
    sourceKey:pistoriaArianeSourceKey(inv,step), pistoriaInvestigationId:inv.id, pistoriaStepId:step.id,

function createArianeCaseFromPistoria(invId,stepId){
  const inv=getInvestigation(invId);if(!inv)return;
  const step=(inv.steps||[]).find(s=>s.id===stepId);if(!step)return;
  if(!window.LenaicBus){toast('Le bus local n’est pas chargé.');return}
  const existing=pistoriaArianeTransfer(inv,step);
  if(!existing)LenaicBus.publish('ariane.case.create',pistoriaArianePayload(inv,step),{source:'pistoria',target:'ariane'});
  toast(existing?(existing.status==='accepted'?'Cette piste est déjà dans Ariane.':'Cette piste est déjà en attente pour Ariane.'):'Piste envoyée à Ariane.');
  window.open(ARIANE_PATH,'_blank','noopener');

function parseFrenchDateFromText(value){
  const text=String(value||'');
  let m=text.match(/\b(\d{2})\/(\d{2})\/(\d{4})\b/);
  if(m)return `${m[3]}-${m[2]}-${m[1]}`;
  m=text.match(/\b(\d{4})-(\d{2})-(\d{2})\b/);
  return m?m[0]:'';
}
function dateYear(value){
  const iso=parseFrenchDateFromText(value);
  if(iso)return Number(iso.slice(0,4));
  const m=String(value||'').match(/\b(1[5-9]\d{2}|20\d{2})\b/);
  return m?Number(m[1]):null;
}
function dateValue(value){
  const iso=parseFrenchDateFromText(value);
  return iso?new Date(iso+'T12:00:00'):null;
}
function diffYears(dateA,dateB){
  const a=dateValue(dateA),b=dateValue(dateB);
  if(!a||!b)return null;
  let years=b.getFullYear()-a.getFullYear();
  const beforeAnniversary=b.getMonth()<a.getMonth()||(b.getMonth()===a.getMonth()&&b.getDate()<a.getDate());
  if(beforeAnniversary)years--;
  return years;
}
function knownFact(inv,label){
  return String(inv.known||'').split('\n').find(x=>x.trim().toLowerCase().startsWith(label.toLowerCase()+':'))||'';
}
function knownDate(inv,label){return parseFrenchDateFromText(knownFact(inv,label))}
function knownPlace(inv,label){
  const line=knownFact(inv,label);
  const m=line.match(/\sà\s(.+)$/i);
  return m?m[1].trim():'';
}
function buildLifeTimeline(inv){
  const events=[];
  const add=(date,label,detail,certainty='forte')=>{
    if(!date&&!detail)return;
    events.push({
      date:date||'',
      year:dateYear(date||detail),
      label,
      detail:detail||'',
      certainty
    });
  };

  const birth=knownDate(inv,'Naissance');
  const death=knownDate(inv,'Décès');
  const marriage=knownDate(inv,'Mariage');
  add(birth,'Naissance',knownFact(inv,'Naissance'),'forte');
  add(marriage,'Mariage',knownFact(inv,'Mariage'),'forte');
  add(death,'Décès',knownFact(inv,'Décès'),'forte');

  for(const log of inv.logs||[]){
    const actDate=log.actDate||log.date||log.consultedAt||'';
    if(log.result==='found'||log.result==='partial'){
      add(actDate,'Acte consulté',log.title||log.stepTitle||log.notes||'Résultat enregistré','moyenne');
    }
    for(const parent of Object.values(log.parentsMentioned||{})){
      if(!parent?.name)continue;
      if(parent.status==='alive'){
        add(actDate,`${parent.name} vivant`,`${parent.role||'Parent'} mentionné vivant`,'forte');
      }
      if(parent.status==='deceased'){
        add(actDate,`${parent.name} décédé`,`${parent.role||'Parent'} mentionné décédé`,'forte');
      }
      if(parent.mentionedDate){
        add(parent.mentionedDate,`${parent.name} — date mentionnée`,parent.mentionedPlace||parent.role||'Mention familiale','forte');
      }
    }
  }

  const memory=ensureEvidenceMemory();
  const key=normalizePersonName(inv.person||'');
  const personMemory=memory.people?.[key];
  for(const ev of personMemory?.evidence||[]){
    add(ev.date||String(ev.year||''),ev.type==='alive'?'Mention vivante':ev.type==='deceased'?'Mention décédée':'Indice mémorisé',ev.source||'',ev.type==='precise-date'?'forte':'moyenne');
  }

  return events
    .filter(e=>e.year)
    .sort((a,b)=>(a.year||9999)-(b.year||9999)||String(a.date).localeCompare(String(b.date)));
}
function lifeTimelineHtml(inv){
  const events=buildLifeTimeline(inv);
  if(!events.length)return '<div class="card empty">Aucun événement daté exploitable.</div>';
  return `<div class="stack">${events.map(e=>`<div class="card list-item">
    <div>
      <div class="kicker">${e.date?fmtDate(e.date):e.year} · confiance ${esc(e.certainty)}</div>
      <h3>${esc(e.label)}</h3>
      <p>${esc(e.detail)}</p>
    </div>
  </div>`).join('')}</div>`;
}
function conceptionWindow(birthDate){
  const birth=dateValue(birthDate);
  if(!birth)return null;
  const latest=new Date(birth);latest.setDate(latest.getDate()-266);
  const earliest=new Date(birth);earliest.setDate(earliest.getDate()-294);
  const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  return {start:iso(earliest),end:iso(latest)};
}
function estimateParentsMarriage(firstChildDate,childAgeAtKnownMarriage=null,knownMarriageYear=null){
  let birthYear=dateYear(firstChildDate);
  if(!birthYear&&knownMarriageYear&&Number.isFinite(childAgeAtKnownMarriage)){
    birthYear=knownMarriageYear-childAgeAtKnownMarriage;
  }
  if(!birthYear)return null;
  return {
    start:birthYear-5,
    end:birthYear,
    priorityStart:birthYear-3,
    priorityEnd:birthYear-1,
    confidence:'probable'
  };
}
function siblingIntervals(dates){
  const parsed=(dates||[]).map(parseFrenchDateFromText).filter(Boolean).sort();
  const intervals=[];
  for(let i=1;i<parsed.length;i++){
    const a=dateValue(parsed[i-1]),b=dateValue(parsed[i]);
    intervals.push(Math.round((b-a)/(365.2425*86400000)*10)/10);
  }
  if(!intervals.length)return {intervals:[],median:null,mean:null,gaps:[]};
  const sorted=[...intervals].sort((a,b)=>a-b);
  const mid=Math.floor(sorted.length/2);
  const median=sorted.length%2?sorted[mid]:(sorted[mid-1]+sorted[mid])/2;
  const mean=intervals.reduce((a,b)=>a+b,0)/intervals.length;
  return {
    intervals,
    median:Math.round(median*10)/10,
    mean:Math.round(mean*10)/10,
    gaps:intervals.map((x,i)=>({years:x,index:i+1})).filter(x=>x.years>Math.max(4,median*1.8))
  };
}
function haversine(lat1,lon1,lat2,lon2){
  const toRad=x=>x*Math.PI/180;
  const R=6371;
  const dLat=toRad(lat2-lat1),dLon=toRad(lon2-lon1);
  const a=Math.sin(dLat/2)**2+Math.cos(toRad(lat1))*Math.cos(toRad(lat2))*Math.sin(dLon/2)**2;
  return R*2*Math.atan2(Math.sqrt(a),Math.sqrt(1-a));
}
function communeScores(inv){
  const scores={};
  const add=(place,points,reason)=>{
    place=String(place||'').trim();
    if(!place)return;
    scores[place]=scores[place]||{score:0,reasons:[]};
    scores[place].score+=points;
    scores[place].reasons.push(reason);
  };
  add(knownPlace(inv,'Naissance'),6,'commune de naissance');
  add(knownPlace(inv,'Mariage'),8,'commune de mariage');
  add(knownPlace(inv,'Décès'),10,'commune de décès déjà mentionnée');
  for(const step of inv.steps||[]){
    add(step.place,step.status==='found'?10:step.status==='partial'?6:step.status==='negative'?-4:2,`${step.type||'piste'} : ${step.status}`);
  }
  for(const log of inv.logs||[]){
    add(log.place||log.foundPlace,log.result==='found'?10:log.result==='partial'?5:log.result==='negative'?-5:1,`résultat ${log.result||'enregistré'}`);
    for(const p of Object.values(log.parentsMentioned||{})){
      add(p.residenceInAct,7,`${p.role||'parent'} domicilié ici`);
      add(p.mentionedPlace,6,`${p.role||'parent'} mentionné ici`);
      add(p.originInAct,4,`${p.role||'parent'} originaire de ce lieu`);
    }
  }
  return Object.entries(scores)
    .map(([place,v])=>({place,score:v.score,reasons:v.reasons}))
    .sort((a,b)=>b.score-a.score);
}
function sourceWeight(stepOrLog){
  const text=`${stepOrLog?.type||''} ${stepOrLog?.sourceCategory||''} ${stepOrLog?.archiveName||''}`.toLowerCase();
  if(/acte original|état civil|registre annuel/.test(text))return 95;
  if(/notaire|succession|matricule|recensement/.test(text))return 80;
  if(/presse|cimetière|insee|francearchives/.test(text))return 70;
  if(/geneanet|arbre|collaborative/.test(text))return 35;
  if(/statistique|médian|estimation/.test(text))return 20;
  return 50;
}
function confidenceScore(inv){
  let total=0,weight=0;
  for(const step of inv.steps||[]){
    if(!['found','partial','negative'].includes(step.status))continue;
    const w=sourceWeight(step);
    let quality=step.status==='found'?1:step.status==='partial'?.65:.15;
    total+=w*quality;weight++;
  }
  for(const log of inv.logs||[]){
    const w=sourceWeight(log);
    let quality=log.result==='found'?1:log.result==='partial'?.65:log.result==='negative'?.15:.3;
    total+=w*quality;weight++;
  }
  if(!weight)return 0;
  return Math.max(0,Math.min(100,Math.round(total/weight)));
}
function consistencyChecks(inv){
  const checks=[];
  const birth=knownDate(inv,'Naissance');
  const marriage=knownDate(inv,'Mariage');
  const death=knownDate(inv,'Décès');

  const add=(severity,title,detail)=>checks.push({severity,title,detail});
  if(birth&&death){
    const age=diffYears(birth,death);
    if(age<0)add('critique','Décès antérieur à la naissance',`${fmtDate(death)} précède ${fmtDate(birth)}.`);
    else if(age>110)add('forte','Âge exceptionnel au décès',`${age} ans : vérifier l’identité ou la transcription.`);
  }
  if(birth&&marriage){
    const age=diffYears(birth,marriage);
    if(age<12)add('critique','Mariage à un âge impossible ou très improbable',`${age} ans au mariage.`);
    else if(age<16)add('forte','Mariage très précoce',`${age} ans : vérifier dispense, erreur de personne ou date.`);
  }
  if(marriage&&death&&dateValue(marriage)>dateValue(death)){
    add('critique','Mariage postérieur au décès','Les deux dates ne peuvent pas appartenir à la même personne.');
  }

  for(const log of inv.logs||[]){
    const actDate=log.actDate||'';
    for(const p of Object.values(log.parentsMentioned||{})){
      if(!p?.mentionedDate||!actDate)continue;
      if(p.status==='alive'&&dateValue(p.mentionedDate)&&dateValue(p.mentionedDate)<dateValue(actDate)){
        add('forte','Mention contradictoire',`${p.name||p.role} est déclaré vivant mais une date antérieure est saisie comme date précise.`);
      }
    }
  }
  return checks;
}
function deductionEngine(inv){
  const deductions=[];
  const timeline=buildLifeTimeline(inv);
  const alive=timeline.filter(e=>/vivant/i.test(e.label));
  const dead=timeline.filter(e=>/décédé|décès/i.test(e.label));
  const latestAlive=alive.sort((a,b)=>(b.year||0)-(a.year||0))[0];
  const earliestDead=dead.sort((a,b)=>(a.year||9999)-(b.year||9999))[0];

  if(latestAlive&&earliestDead&&latestAlive.year<=earliestDead.year){
    deductions.push({
      title:'Fourchette de décès',
      detail:`Décès compris entre ${latestAlive.date?fmtDate(latestAlive.date):latestAlive.year} et ${earliestDead.date?fmtDate(earliestDead.date):earliestDead.year}.`,
      confidence:'forte',
      basis:`Dernière mention vivante : ${latestAlive.detail}. Première mention décédée : ${earliestDead.detail}.`
    });
  }else if(latestAlive&&inv.evidenceWindow?.upperYear){
    deductions.push({
      title:'Fourchette de décès provisoire',
      detail:`Décès après ${latestAlive.year} et avant ${inv.evidenceWindow.upperYear}.`,
      confidence:'moyenne',
      basis:inv.evidenceWindow.medianReason||inv.evidenceWindow.upperReason||''
    });
  }

  if(inv.marriageEvidenceWindow?.upperYear){
    deductions.push({
      title:'Borne haute probable du mariage des parents',
      detail:`Mariage probablement antérieur ou proche de ${inv.marriageEvidenceWindow.upperYear}.`,
      confidence:'probable',
      basis:inv.marriageEvidenceWindow.reason||''
    });
  }

  const birth=knownDate(inv,'Naissance');
  if(birth){
    const conception=conceptionWindow(birth);
    deductions.push({
      title:'Période probable de conception',
      detail:`Entre le ${fmtDate(conception.start)} et le ${fmtDate(conception.end)}.`,
      confidence:'biologique',
      basis:'Fenêtre usuelle de 266 à 294 jours avant la naissance.'
    });
  }

  return deductions;
}
function analysisSummary(inv){
  return {
    timeline:buildLifeTimeline(inv),
    checks:consistencyChecks(inv),
    deductions:deductionEngine(inv),
    communes:communeScores(inv),

function republicanToGregorian(day,month,year){
  const months=['Vendémiaire','Brumaire','Frimaire','Nivôse','Pluviôse','Ventôse','Germinal','Floréal','Prairial','Messidor','Thermidor','Fructidor','Sans-culottides'];
  const monthIndex=months.findIndex(m=>m.toLowerCase()===String(month||'').trim().toLowerCase());
  if(monthIndex<0||year<1||day<1)return null;
  const epoch=new Date('1792-09-22T12:00:00');
  const days=(year-1)*365+Math.floor((year+1)/4)+monthIndex*30+(day-1);
  const result=new Date(epoch);result.setDate(result.getDate()+days);
  return `${result.getFullYear()}-${String(result.getMonth()+1).padStart(2,'0')}-${String(result.getDate()).padStart(2,'0')}`;
}
function homonymScore(a,b){
  const fields=[
    ['birthYear',25],['birthPlace',20],['spouse',20],['parents',15],
    ['profession',10],['residence',10]
  ];
  let score=0,possible=0,details=[];
  for(const [field,weight] of fields){
    const av=normalizePersonName(a[field]),bv=normalizePersonName(b[field]);
    if(!av&&!bv)continue;
    possible+=weight;
    if(av&&bv&&(av===bv||av.includes(bv)||bv.includes(av))){
      score+=weight;details.push(`${field} concordant`);
    }else if(av&&bv){
      details.push(`${field} différent`);
    }
  }
  return {score:possible?Math.round(score/possible*100):0,details};
}

function calculateBirthWindow(){
  const dateValue=document.querySelector('#calcActDate')?.value;
  const age=Number(document.querySelector('#calcAge')?.value);
  const months=Number(document.querySelector('#calcMonths')?.value||0);
  const days=Number(document.querySelector('#calcDays')?.value||0);
  const box=document.querySelector('#calcResult');
  if(!box)return;
  if(!dateValue||!Number.isFinite(age)||age<0){
    box.innerHTML='<h3>Résultat</h3><div class="notice">Renseigne la date de l’acte et l’âge déclaré.</div>';
    return;
  }
  const act=new Date(dateValue+'T12:00:00');
  const latest=new Date(act);
  latest.setFullYear(latest.getFullYear()-age);
  latest.setMonth(latest.getMonth()-months);
  latest.setDate(latest.getDate()-days);
  const earliest=new Date(latest);
  if(months===0&&days===0){
    earliest.setFullYear(earliest.getFullYear()-1);
    earliest.setDate(earliest.getDate()+1);
  }
  const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  const yearA=earliest.getFullYear(),yearB=latest.getFullYear();
  box.innerHTML=`<h3>Résultat</h3>
    <div class="notice"><strong>Naissance probable entre le ${fmtDate(iso(earliest))} et le ${fmtDate(iso(latest))}</strong></div>
    <p>Année ou années à vérifier : <strong>${yearA===yearB?yearA:`${yearA} et ${yearB}`}</strong>.</p>
    <p class="muted">Cette estimation dépend de l’exactitude de l’âge déclaré. Vérifie l’acte original, la commune d’origine et les parents avant de conclure.</p>`;
}


function calculateConception(){

function calculateMarriageEstimate(){

    <p class="muted">Une naissance hors mariage reste possible : cette estimation est probable, pas certaine.</p>`;
}
function calculateSiblings(){
  const values=String(document.querySelector('#siblingDates')?.value||'').split(/\n|,/).map(x=>x.trim()).filter(Boolean);
  const box=document.querySelector('#siblingResult');

  box.innerHTML=`<div class="notice"><strong>Intervalle médian : ${result.median} ans</strong><br>Intervalle moyen : ${result.mean} ans.</div>

    ${result.gaps.length?`<div class="reason-box"><strong>Interruption inhabituelle</strong><br>${result.gaps.map(g=>`Intervalle ${g.index} : ${g.years} ans`).join('<br>')}<br>À vérifier : enfant manquant, décès, remariage ou migration.</div>`:''}`;
}
function calculateDistance(){
  const values=['lat1','lon1','lat2','lon2'].map(id=>Number(document.querySelector('#'+id)?.value));
  const box=document.querySelector('#distanceResult');
  if(!box)return;
  if(values.some(x=>!Number.isFinite(x))){box.innerHTML='<div class="notice">Renseigne les quatre coordonnées.</div>';return}
  const km=haversine(...values);
  box.innerHTML=`<div class="notice"><strong>Distance à vol d’oiseau : ${km.toFixed(1)} km</strong></div>
    <p class="muted">${km<10?'Déplacement local très plausible.':km<30?'Déplacement régional courant.':'Migration plus importante : rechercher une cause professionnelle ou familiale.'}</p>`;
}

function yearFromValue(v){
  const m=String(v||'').match(/\b(1[5-9]\d{2}|20\d{2})\b/);
  return m?Number(m[1]):null
}
const PARENT_ROLES=[
  {key:'husbandFather',label:'Père de l’époux'},
  {key:'husbandMother',label:'Mère de l’époux'},
  {key:'wifeFather',label:'Père de l’épouse'},
  {key:'wifeMother',label:'Mère de l’épouse'}
];


function normalizePersonName(value){
  return String(value||'')
    .normalize('NFD').replace(/[\u0300-\u036f]/g,'')
    .replace(/[’']/g,"'")
    .replace(/\s+/g,' ')
    .trim()
    .toLowerCase();
}
function ensureEvidenceMemory(){
  data.evidenceMemory=data.evidenceMemory||{people:{},families:[]};
  data.evidenceMemory.people=data.evidenceMemory.people||{};
  data.evidenceMemory.families=data.evidenceMemory.families||[];
  return data.evidenceMemory;
}
function rememberPersonEvidence(name,evidence){
  const key=normalizePersonName(name);
  if(!key)return;
  const memory=ensureEvidenceMemory();
  const current=memory.people[key]||{name:name,evidence:[]};
  current.name=current.name||name;
  current.evidence=current.evidence||[];
  const signature=JSON.stringify({
    type:evidence.type,
    year:evidence.year,
    source:evidence.source,
    relation:evidence.relation
  });
  if(!current.evidence.some(x=>JSON.stringify({
    type:x.type,year:x.year,source:x.source,relation:x.relation
  })===signature)){
    current.evidence.push(evidence);
  }
  memory.people[key]=current;
}
function rememberFamilyMarriageBound(parent1,parent2,upperYear,source,childName){
  if(!upperYear)return;
  const names=[normalizePersonName(parent1),normalizePersonName(parent2)].filter(Boolean).sort();
  if(!names.length)return;
  const memory=ensureEvidenceMemory();
  const key=names.join('|');
  const existing=memory.families.find(x=>x.key===key);
  const entry={
    key,
    parentNames:[parent1,parent2].filter(Boolean),
    upperYear,
    source,
    childName,
    reason:`Le mariage des parents est probablement antérieur ou proche de la naissance estimée de ${childName||'leur enfant'} (${upperYear}).`
  };
  if(existing){
    if(!existing.upperYear||upperYear<existing.upperYear)Object.assign(existing,entry);
  }else{
    memory.families.push(entry);
  }
}
function evidenceForInvestigation(inv){
  const memory=ensureEvidenceMemory();
  const invName=normalizePersonName(inv.person||'');
  const personEntries=Object.values(memory.people).filter(p=>{
    const key=normalizePersonName(p.name);
    return key&&(invName===key||invName.includes(key)||key.includes(invName));
  });
  const familyEntries=memory.families.filter(f=>
    (f.parentNames||[]).some(name=>{
      const key=normalizePersonName(name);
      return key&&(invName===key||invName.includes(key)||key.includes(invName));
    })
  );
  return {personEntries,familyEntries};
}
function applyEvidenceMemoryToInvestigations(){
  for(const inv of data.investigations||[]){
    const {personEntries,familyEntries}=evidenceForInvestigation(inv);
    inv.rememberedEvidence={people:personEntries,families:familyEntries};

    if(investigationMissing(inv,'décès')){
      inv.evidenceWindow=inv.evidenceWindow||{lowerYear:null,upperYear:null,status:'provisional'};
      for(const person of personEntries){
        for(const ev of person.evidence||[]){
          if(ev.type==='alive'&&ev.year){
            if(!inv.evidenceWindow.lowerYear||ev.year>inv.evidenceWindow.lowerYear){
              inv.evidenceWindow.lowerYear=ev.year;
              inv.evidenceWindow.lowerReason=`Mentionné vivant en ${ev.year} dans ${ev.source}.`;
            }
          }
          if(ev.type==='deceased'&&ev.year){
            if(!inv.evidenceWindow.upperYear||ev.year<inv.evidenceWindow.upperYear){
              inv.evidenceWindow.upperYear=ev.year;
              inv.evidenceWindow.upperReason=`Mentionné décédé en ${ev.year} dans ${ev.source}.`;
            }
          }
        }
      }
    }

    if(investigationMissing(inv,'mariage')&&familyEntries.length){
      inv.marriageEvidenceWindow=inv.marriageEvidenceWindow||{};
      const best=familyEntries.sort((a,b)=>(a.upperYear||9999)-(b.upperYear||9999))[0];
      inv.marriageEvidenceWindow.upperYear=best.upperYear;
      inv.marriageEvidenceWindow.reason=best.reason;
      inv.marriageEvidenceWindow.source=best.source;
    }
  }
}
function rememberedEvidenceHtml(inv){
  const remembered=inv.rememberedEvidence||{};
  const rows=[];
  for(const person of remembered.people||[]){
    for(const ev of person.evidence||[]){
      rows.push(`${person.name} : ${ev.type==='alive'?'vivant':ev.type==='deceased'?'décédé':ev.type} en ${ev.year||'date inconnue'} — ${ev.source||'source familiale'}`);
    }
  }
  for(const fam of remembered.families||[]){
    rows.push(`Mariage des parents : borne haute ${fam.upperYear} — ${fam.reason}`);
  }
  if(!rows.length)return'';
  return `<div class="reason-box" style="margin-top:10px"><strong>Mémoire familiale utile</strong><br>${rows.map(esc).join('<br>')}</div>`;
}

function parentFieldsFromForm(fd){
  const result={};
  const husbandAge=(fd.get('husbandAgeInAct')||'').trim();
  const wifeAge=(fd.get('wifeAgeInAct')||'').trim();
  for(const role of PARENT_ROLES){
    const prefix=`parent_${role.key}_`;
    result[role.key]={
      role:role.label,
      name:(fd.get(prefix+'name')||'').trim(),
      status:fd.get(prefix+'status')||'',
      mentionedDate:(fd.get(prefix+'mentionedDate')||'').trim(),
      mentionedPlace:(fd.get(prefix+'mentionedPlace')||'').trim(),
      ageInAct:(fd.get(prefix+'ageInAct')||'').trim(),
      originInAct:(fd.get(prefix+'originInAct')||'').trim(),
      residenceInAct:(fd.get(prefix+'residenceInAct')||'').trim(),
      childAgeInAct:role.key.startsWith('husband')?husbandAge:wifeAge,
      childRole:role.key.startsWith('husband')?'époux':'épouse',
      isTarget:fd.get('targetParentRole')===role.key
    };
  }
  return result;
}

function updateEvidenceWindow(inv,step,fd){
  inv.evidenceWindow=inv.evidenceWindow||{
    lowerYear:null,
    upperYear:null,
    maxWorkingAge:data.settings?.maxWorkingAge||100,
    status:'provisional'
  };
  const w=inv.evidenceWindow;
  const actDate=fd.get('actDate')||fd.get('date')||'';
  const actYear=yearFromValue(actDate)||yearFromValue(step.period);
  const parents=parentFieldsFromForm(fd);
  const target=Object.values(parents).find(p=>p.isTarget);

  if(target){
    if(target.status==='alive'&&actYear){
      if(!w.lowerYear||actYear>w.lowerYear)w.lowerYear=actYear;
      w.lowerReason=`${target.role} (${target.name||inv.person}) mentionné vivant dans ${step.title} en ${actYear}.`;
    }
    if(target.status==='deceased'&&actYear){
      if(!w.upperYear||actYear<w.upperYear)w.upperYear=actYear;
      w.upperReason=`${target.role} (${target.name||inv.person}) mentionné décédé dans ${step.title} en ${actYear}.`;
    }
    if(target.mentionedDate){
      const y=yearFromValue(target.mentionedDate);
      if(y){
        w.lowerYear=y;
        w.upperYear=y;
        w.status='resolved';
        w.lowerReason=`Date précise relevée pour ${target.role}.`;
        w.upperReason=`Date précise relevée pour ${target.role}.`;
      }
    }
  }

  const sourceLabel=`${step.title}${actYear?` (${actYear})`:''}`;
  for(const parent of Object.values(parents)){
    if(!parent.name)continue;

    if(parent.status==='alive'&&actYear){
      rememberPersonEvidence(parent.name,{
        type:'alive',
        year:actYear,
        source:sourceLabel,
        relation:parent.role
      });
    }
    if(parent.status==='deceased'&&actYear){
      rememberPersonEvidence(parent.name,{
        type:'deceased',
        year:actYear,
        source:sourceLabel,
        relation:parent.role
      });
    }
    if(parent.mentionedDate){
      rememberPersonEvidence(parent.name,{
        type:'precise-date',
        year:yearFromValue(parent.mentionedDate),
        date:parent.mentionedDate,
        place:parent.mentionedPlace,
        source:sourceLabel,
        relation:parent.role
      });
    }
  }

  const husbandParents=[parents.husbandFather?.name,parents.husbandMother?.name];
  const wifeParents=[parents.wifeFather?.name,parents.wifeMother?.name];
  const husbandAge=Number(parents.husbandFather?.childAgeInAct||parents.husbandMother?.childAgeInAct||0);
  const wifeAge=Number(parents.wifeFather?.childAgeInAct||parents.wifeMother?.childAgeInAct||0);

  if(actYear&&husbandAge>0){
    const estimatedBirthYear=actYear-husbandAge;
    rememberFamilyMarriageBound(
      husbandParents[0],husbandParents[1],estimatedBirthYear,
      sourceLabel,'l’époux'
    );
  }
  if(actYear&&wifeAge>0){
    const estimatedBirthYear=actYear-wifeAge;
    rememberFamilyMarriageBound(
      wifeParents[0],wifeParents[1],estimatedBirthYear,
      sourceLabel,'l’épouse'
    );
  }

  step.parentsMentioned=parents;
  step.targetParentRole=fd.get('targetParentRole')||'';
  step.husbandAgeInAct=(fd.get('husbandAgeInAct')||'').trim();
  step.wifeAgeInAct=(fd.get('wifeAgeInAct')||'').trim();
  step.actDate=actDate;

  applyEvidenceMemoryToInvestigations();
}

function investigationMissing(inv,kind){
  return (inv.missingSummary||[]).some(x=>String(x||'').toLowerCase().startsWith(kind.toLowerCase()+':'));
}
function exactKnownDate(inv,label){
  const line=String(inv.known||'').split('\n').find(x=>x.trim().toLowerCase().startsWith(label.toLowerCase()+':'));
  if(!line)return'';
  const m=line.match(/\b(\d{2})\/(\d{2})\/(\d{4})\b/);
  return m?`${m[3]}-${m[2]}-${m[1]}`:'';
}
function knownYear(inv,label){
  const iso=exactKnownDate(inv,label);
  if(iso)return Number(iso.slice(0,4));
  const line=String(inv.known||'').split('\n').find(x=>x.trim().toLowerCase().startsWith(label.toLowerCase()+':'));
  const m=String(line||'').match(/\b(1[5-9]\d{2}|20\d{2})\b/);
  return m?Number(m[1]):null;
}
function cohortMedianDeathAge(birthYear){
  if(!birthYear)return 72;
  if(birthYear<1750)return 68;
  if(birthYear<1800)return 70;
  if(birthYear<1850)return 72;
  if(birthYear<1900)return 75;
  if(birthYear<1930)return 78;
  return 82;
}
function normalizeEvidenceWindows(){
  for(const inv of data.investigations||[]){
    const deathAlreadyKnown=Boolean(exactKnownDate(inv,'Décès'));
    const deathStillMissing=investigationMissing(inv,'décès');

    if(deathAlreadyKnown||!deathStillMissing){
      delete inv.evidenceWindow;
      continue;
    }

    const birthYear=knownYear(inv,'Naissance');
    const w=inv.evidenceWindow||{};
    const medianAge=cohortMedianDeathAge(birthYear);
    const hardUpper=birthYear?birthYear+(data.settings?.maxWorkingAge||100):w.upperYear||null;
    const medianYear=birthYear?birthYear+medianAge:null;

    inv.evidenceWindow={
      ...w,
      lowerYear:w.lowerYear||null,
      upperYear:hardUpper,
      medianAge,
      medianYear,
      upperReason:birthYear
        ?`Borne maximale de travail : ${birthYear} + ${data.settings?.maxWorkingAge||100} ans.`
        :(w.upperReason||'Borne haute à préciser.'),
      medianReason:medianYear
        ?`Zone de recherche prioritaire autour de ${medianYear}, calculée avec un âge médian de travail de ${medianAge} ans pour cette génération.`
        :'Âge médian à calculer après identification de l’année de naissance.',
      status:w.status||'provisional'
    };
  }
}
function replaceKnownLine(inv,label,newDate,newPlace){
  const lines=String(inv.known||'').split('\n');
  const index=lines.findIndex(x=>x.trim().toLowerCase().startsWith(label.toLowerCase()+':'));
  const old=index>=0?lines[index]:'';
  const oldDate=(old.match(/\b\d{2}\/\d{2}\/\d{4}\b/)||[])[0]||'';
  const oldPlace=(old.match(/\sà\s(.+)$/i)||[])[1]||'';
  const dateText=newDate?fmtDate(newDate):oldDate||'date inconnue';
  const placeText=newPlace||oldPlace;
  const line=`${label} : ${dateText}${placeText?` à ${placeText}`:''}`;
  if(index>=0)lines[index]=line;
  else lines.unshift(line);
  inv.known=lines.join('\n');
}
function cleanMissingText(value){
  return String(value||'')
    .replace(/\s*,\s*,/g,',')
    .replace(/^[\s,;]+|[\s,;]+$/g,'')
    .replace(/\s{2,}/g,' ');
}
function updateMissingSummaryFromResult(inv,step,fd){
  const section=String(step.targetSection||'').toLowerCase();
  const foundDate=(fd.get('foundDate')||'').trim();
  const foundPlace=(fd.get('foundPlace')||'').trim();

  let kind='';
  let label='';
  if(section.includes('naissance')){kind='naissance';label='Naissance'}
  else if(section.includes('décès')){kind='décès';label='Décès'}
  else if(section.includes('mariage')||section.includes('couple')){kind='mariage';label='Mariage'}
  if(!kind)return;

  if(kind==='mariage'){
    const current=(inv.missingSummary||[]).find(x=>String(x).toLowerCase().startsWith('mariage:'))||'';
    let remaining=current.replace(/^mariage\s*:\s*/i,'');
    if(foundDate)remaining=remaining.replace(/date exacte du mariage/gi,'');
    if(foundPlace)remaining=remaining.replace(/commune précise du mariage/gi,'');
    remaining=cleanMissingText(remaining);
    inv.missingSummary=(inv.missingSummary||[]).filter(x=>!String(x).toLowerCase().startsWith('mariage:'));
    if(remaining)inv.missingSummary.push(`mariage : ${remaining}`);
  }else{
    replaceKnownLine(inv,label,foundDate,foundPlace);
    const current=(inv.missingSummary||[]).find(x=>String(x).toLowerCase().startsWith(kind+':'))||'';
    let remaining=current.replace(new RegExp('^'+kind+'\\s*:\\s*','i'),'');
    if(foundDate)remaining=remaining.replace(/date exacte/gi,'');
    if(foundPlace)remaining=remaining.replace(/commune précise/gi,'');
    remaining=cleanMissingText(remaining);
    inv.missingSummary=(inv.missingSummary||[]).filter(x=>!String(x).toLowerCase().startsWith(kind+':'));
    if(remaining)inv.missingSummary.push(`${kind} : ${remaining}`);
    if(kind==='décès'&&foundDate)delete inv.evidenceWindow;
  }

  const knownLines=String(inv.known||'').split('\n').filter(x=>!x.trim().toLowerCase().startsWith('à compléter'));
  if((inv.missingSummary||[]).length){
    knownLines.push('À compléter : '+inv.missingSummary.join(' ; '));
  }else{
    knownLines.push('Fiche complétée avec les résultats enregistrés dans Pistoria.');
    inv.status='closed';
    inv.classifiedAt=inv.classifiedAt||new Date().toISOString();
    inv.classificationReason=inv.classificationReason||'preuve décisive retrouvée';
  }
  inv.known=knownLines.join('\n');
}
